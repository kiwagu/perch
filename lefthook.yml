# Git hooks for this repository; `bun install` installs them via the root
# `prepare` script. Every job first sources scripts/ensure-path.sh so the hooks
# also work when git is driven by an IDE with a minimal PATH.
# A gitignored lefthook-local.yml may add machine-specific checks.

pre-commit:
  piped: true
  jobs:
    - name: format staged files
      glob: '*.{js,mjs,cjs,ts,tsx,json,jsonc,css}'
      run: . scripts/ensure-path.sh && biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

    # The formatter is a beta and cannot parse every statement; a file it rejects
    # stays as written, and the validator below is the gate.
    - name: format staged SurrealQL
      glob: '*.surql'
      run: . scripts/ensure-path.sh && (surqlfmt --write {staged_files} || true)
      stage_fixed: true

    - name: validate staged SurrealQL
      glob: '*.surql'
      run: . scripts/ensure-path.sh && surreal db validate {staged_files}

    - name: regenerate models when SurrealQL is staged
      glob: '*.surql'
      run: >-
        . scripts/ensure-path.sh && bun run model &&
        git ls-files -z --modified --others --exclude-standard --
        '*.model.gen.ts' '*.surql.d.ts' '*.model.json' 'database/src/replica.schema.gen.ts'
        'database/tests/suites/generated-*.toml'
        | xargs -0 -r git add --

    - name: i18n catalogs
      run: . scripts/ensure-path.sh && bun run i18n:check

    - name: typecheck
      run: . scripts/ensure-path.sh && bun run typecheck

    - name: lint
      run: . scripts/ensure-path.sh && bun run lint

    - name: readmes of packages and modules
      run: . scripts/ensure-path.sh && bun run readme:check

    # On a branch the contract may run ahead of the app (a business commit before its
    # implementation): the sources must use only what it declares, and a scenario may wait
    # for its test. A commit on main, the landing, takes the full check: every declared
    # anchor rendered, every scenario paired with its test, step for step.
    - name: contract
      run: >-
        . scripts/ensure-path.sh && bun run contract:check &&
        if [ "$(git branch --show-current)" = main ];
        then bun run contract:check:sources && bun run e2e:coverage;
        else bun run contract:check:sources:ahead; fi &&
        bun run contract:check:consumers

    - name: source file sizes
      run: . scripts/ensure-path.sh && bun run refactor:ci

    # On a branch an app's machine may lag its flow (a business commit before its
    # implementation): it lacks what the flow added and does nothing the flow does not say, or it
    # is still its screen's flow at the branch's merge base with main (during a merge, the base
    # the merge's commit will have) or at the commit the branch is at, and a route may still read
    # as its binding did at that base; the script names both commits, so the test cache keys on
    # them. A branch whose merge base cannot be found fails here. A commit on main, the landing, and one on a detached HEAD hold
    # every machine to its whole flow (scripts/contract-ahead.ts).
    - name: unit tests
      run: . scripts/ensure-path.sh && bun run scripts/contract-ahead.ts bun run test

    # A commit on main is a landing: the database and e2e suites must have
    # passed on exactly this tree (receipts under .gates/, see scripts/gates).
    - name: suites recorded before landing on main
      run: . scripts/ensure-path.sh && bun run scripts/gates/check-main-gates.ts

# A merge git commits itself (`git merge` without a conflict to resolve) runs this hook,
# not pre-commit. It runs pre-commit as a whole, the machine-local jobs included, so an
# automatic merge, into main too, is checked as a commit is, and what a formatter fixes is
# staged into it (lefthook stages fixed files only for a hook named pre-commit).
# CONTRACT_AHEAD_MERGE tells scripts/contract-ahead.ts that git has written no MERGE_HEAD yet,
# so it reads the commits the merge brings in from the merge's reflog action.
pre-merge-commit:
  jobs:
    - name: the pre-commit checks
      run: . scripts/ensure-path.sh && CONTRACT_AHEAD_MERGE=1 lefthook run pre-commit
