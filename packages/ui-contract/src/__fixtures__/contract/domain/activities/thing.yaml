# yaml-language-server: $schema=../../schemas/activity.schema.json
id: thing
title: Edit the thing
description: A member opens the thing, saves its title and is done with it.
roles: [ member ]
data:
  thing:
    description: The thing being edited, by its key.
  thing.title:
    description: The title the member saves.
    model: thing.title
initial: editing
states:
  editing:
    description: The thing in its form.
    meta: { screen: sample, address: { path: /sample/$key } }
    on:
      sample.save-button:
        target: saved
        description: The title is saved.
  saved:
    description: The thing with its title saved.
    type: final
    meta: { screen: sample, address: { path: /sample/$key } }
