# yaml-language-server: $schema=../../screen.schema.json
id: sample
title: One thing, edited
description: The one thing of the sample, shown and edited in place; the proof of the contract's rules.
flag: null
bindings: [ { path: /sample/$key, guard: authenticated, roles: [ member ], params: { type: object, properties: { key: { type: string } }, additionalProperties: false } } ]
entry: [ sample.page, sample.title-input ]
anchors:
  sample.page:
    kind: page
    description: The root of the screen.
  sample.title-input:
    kind: input
    binding: { model: thing.title }
  sample.save-button:
    kind: button
    binding:
      - action: thing.createThing
        params:
          title: sample.title-input
      - action: thing.updateThing
        params:
          title: sample.title-input
    roles: [ member ]
    codes: [ saved, failed ]
  sample.list:
    kind: list
    source:
      entity: thing
      order: created_at
      direction: asc
    states: [ loading ]
  sample.list.row-item:
    kind: item
    dataId: the thing's id
  sample.sign-out-button:
    kind: button
    binding:
      action: platform.sign-out
      params:
        forgetUnsent:
          value: true
flow:
  initial: editing
  states:
    editing:
      on:
        sample.save-button:
          target: saving
    saving:
      invoke:
        src: thing.updateThing
        input:
          title: sample.title-input
        onDone:
          target: editing
          actions:
            - type: show
              params:
                anchor: sample.save-button
                codes:
                  - saved
            - type: navigate
              params:
                to: /sample/$key
        onError:
          target: editing
          actions:
            - type: show
              params:
                anchor: sample.save-button
                codes:
                  - failed
