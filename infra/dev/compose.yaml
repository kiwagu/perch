# The services of a local stand, each run by two mcproc apps per checkout (one per stand) with
# `compose run --name <project>-<service>-<stand>` under the checkout's compose project, so two
# stands, or two checkouts, never share a container. Host networking on 127.0.0.1 for both.
#
# `caddy`: the stand's same-origin front: the web app's build (read-only: apps/web/dist for the
# e2e stand, apps/web/dist-dev, the dev watcher's, for the dev stand, by WEB_DIST) and, under
# /backend/, the gateway, WebSocket upgrades included. Host networking lets Caddy reach the
# gateway on 127.0.0.1; the site binds 127.0.0.1 only. The apps caddy-dev and caddy-e2e pass the
# stand's ports in FRONT_PORT and GATEWAY_PORT, the manifest switch in PERCH_UI_MANIFEST and, in
# PERCH_CLIENT_ADDRESS, whom it names to the gateway as the client (peer, or claimed on the e2e
# stand: the Caddyfile says how).
#
# `maildev`: the stand's mailbox. The apps maildev-dev and maildev-e2e pass the stand's ports in
# MAILDEV_SMTP_PORT and MAILDEV_WEB_PORT.
services:
  caddy:
    image: caddy:2.10.2-alpine
    network_mode: host
    environment:
      - FRONT_PORT
      - GATEWAY_PORT
      - PERCH_UI_MANIFEST
      - PERCH_CLIENT_ADDRESS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - ../../apps/web/${WEB_DIST:-dist}:/srv/web:ro
  maildev:
    # The stand's mailbox: it takes every mail the gateway sends over SMTP and shows it in its web
    # UI and its REST API (GET /email, GET /email/:id, GET /email/:id/html, DELETE /email/all,
    # GET /healthz). Pinned to the last 2.x by digest. Mails live in the container only.
    image: maildev/maildev:2.2.1@sha256:180ef51f65eefebb0e7122d8308813c1fd7bff164bc440ce5a3c2feee167a810
    network_mode: host
    environment:
      - MAILDEV_SMTP_PORT
      - MAILDEV_WEB_PORT
      - MAILDEV_IP=127.0.0.1
      - MAILDEV_WEB_IP=127.0.0.1
    # the image's own check asks localhost, which the container resolves to ::1 first, where
    # MailDev, bound to 127.0.0.1, does not listen; `$$` leaves the port to the container's shell
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:$${MAILDEV_WEB_PORT}/healthz || exit 1']
