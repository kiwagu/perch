# Same-origin front of a local stand: the web app's build (read-only: apps/web/dist for the e2e
# stand, apps/web/dist-dev, the dev watcher's, for the dev stand, by WEB_DIST) and, under
# /backend/, the gateway, WebSocket upgrades included. Host networking lets Caddy reach the
# gateway on 127.0.0.1; the site binds 127.0.0.1 only. The mcproc apps caddy-dev and caddy-e2e
# each run this one service with `compose run --name <project>-caddy-<stand>` under the
# checkout's compose project, with the stand's ports in FRONT_PORT and GATEWAY_PORT and the
# manifest switch in PERCH_UI_MANIFEST, so two stands, or two checkouts, never share a container.
services:
  caddy:
    image: caddy:2.10.2-alpine
    network_mode: host
    environment:
      - FRONT_PORT
      - GATEWAY_PORT
      - PERCH_UI_MANIFEST
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - ../../apps/web/${WEB_DIST:-dist}:/srv/web:ro
