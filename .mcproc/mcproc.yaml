# Local stands for this repository, driven by mcproc (pm2 underneath).
# Fields: kind build|server|worker|task; run = shell command; cwd relative to the
# project root; port = declared listening port; profiles = named groups of apps.
version: 1
project: perch
apps:
  surrealdb-dev:
    description: >-
      SurrealDB 3.3.4 in memory for local development on 127.0.0.1:8000 (root/root).
      Data is gone when it stops.
    kind: server
    run: >-
      docker rm -f perch-surrealdb-dev >/dev/null 2>&1;
      exec docker run --rm --name perch-surrealdb-dev -p 127.0.0.1:8000:8000
      surrealdb/surrealdb:v3.3.4 start --user root --pass root --bind 0.0.0.0:8000 memory
    # docker-proxy holds the published port outside the app's processes, so the app
    # declares only its url: `wait` and `depends_on: ready` check it over HTTP
    url: http://127.0.0.1:8000/health
  surrealdb-e2e:
    description: >-
      SurrealDB 3.3.4 in memory for the schema permission suites and e2e runs on
      127.0.0.1:8010 (root/root). Every start begins with an empty database.
    kind: server
    run: >-
      docker rm -f perch-surrealdb-e2e >/dev/null 2>&1;
      exec docker run --rm --name perch-surrealdb-e2e -p 127.0.0.1:8010:8000
      surrealdb/surrealdb:v3.3.4 start --user root --pass root --bind 0.0.0.0:8000 memory
    # docker-proxy holds the published port outside the app's processes, so the app
    # declares only its url: `wait` and `depends_on: ready` check it over HTTP
    url: http://127.0.0.1:8010/health
  web:
    description: >-
      The web application's build watcher: `vite build --watch` in development mode
      (source maps, no minifying) rewrites apps/web/dist on every source change, in 1-3 s,
      and caddy-dev serves it at https://localhost:5443; reload the page to see a change.
      Each signed-in identity's database runs in the browser (WASM on IndexedDB); signing
      up or in and syncing go through the gateway under /backend/ of the same front.
    kind: build
    run: bun run dev
    cwd: apps/web
  gateway:
    description: >-
      The gateway on 127.0.0.1:5181 for local development: sign-in over HTTP and sync
      over WebSocket, the only client of the dev SurrealDB. Sets up its namespace
      account on the stand first, then reloads on every source change.
    kind: server
    run: >-
      SURREAL_URL=ws://127.0.0.1:8000/rpc SURREAL_USER=root SURREAL_PASS=root
      bun scripts/stand-operator.ts &&
      SURREAL_URL=ws://127.0.0.1:8000/rpc GATEWAY_PORT=5181
      GATEWAY_SURREAL_USER=gateway GATEWAY_SURREAL_PASS=gateway-stand-password
      exec bun --watch apps/gateway/src/index.ts
    port: 5181
    url: http://127.0.0.1:5181/health
    depends_on:
      - { app: surrealdb-dev, condition: ready, timeout: 120 }
  gateway-e2e:
    description: >-
      The gateway on 127.0.0.1:5191 for the e2e runs, the only client of the e2e
      SurrealDB. Sets up its namespace account on the stand first, then reloads on
      every source change.
    kind: server
    run: >-
      SURREAL_URL=ws://127.0.0.1:8010/rpc SURREAL_USER=root SURREAL_PASS=root
      bun scripts/stand-operator.ts &&
      SURREAL_URL=ws://127.0.0.1:8010/rpc GATEWAY_PORT=5191
      GATEWAY_SURREAL_USER=gateway GATEWAY_SURREAL_PASS=gateway-stand-password
      exec bun --watch apps/gateway/src/index.ts
    port: 5191
    url: http://127.0.0.1:5191/health
    depends_on:
      - { app: surrealdb-e2e, condition: ready, timeout: 120 }
  caddy-dev:
    description: >-
      Caddy on https://localhost:5443: the web app's build from apps/web/dist, kept fresh
      by the web watcher (a 404 until its first build finishes), and, under /backend/, the
      gateway; certificates from infra/dev/make-certs.sh.
    kind: server
    # docker would create a missing apps/web/dist as root, which the watcher could not write
    run: >-
      sh infra/dev/make-certs.sh >/dev/null && mkdir -p apps/web/dist &&
      exec docker compose -f infra/dev/compose.yaml up caddy-dev
    # Caddy listens from its container, outside the app's processes, so the app declares
    # only its url (checked without verifying the local certificate)
    url: https://localhost:5443/
    # start order only: Caddy serves whatever apps/web/dist holds
    depends_on: [web, gateway]
  caddy-e2e:
    description: >-
      Caddy on https://localhost:5493: the web app's build from apps/web/dist (the e2e
      launcher makes the production build first) and, under /backend/, the gateway-e2e;
      certificates from infra/dev/make-certs.sh.
    kind: server
    # docker would create a missing apps/web/dist as root, which a build could not write
    run: >-
      sh infra/dev/make-certs.sh >/dev/null && mkdir -p apps/web/dist &&
      exec docker compose -f infra/dev/compose.yaml up caddy-e2e
    # Caddy listens from its container, outside the app's processes, so the app declares
    # only its url (checked without verifying the local certificate)
    url: https://localhost:5493/
    depends_on: [gateway-e2e]
profiles:
  dev: [surrealdb-dev, gateway, web, caddy-dev]
  e2e: [surrealdb-e2e, gateway-e2e, caddy-e2e]
