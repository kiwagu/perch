name = "tenant-structure"
tags = ["structure", "tenant"]

# The organisation database's tables as the gateway writes them: a member keyed by an
# identity id with a role, a note with its author and a text of at most the length the
# contract states (the schema's `$note_text_max_length`), and the organisation's settings
# with a default language the app speaks, or none.
# Record users have no access to any of them.

[[cases]]
name = "root adds a member and a note"
kind = "sql_expect"
actor = "root"
sql = "CREATE member:idn_test SET role = 'admin'; CREATE note:one SET author = member:idn_test, text = 'hello';"
allow = true

[[cases]]
name = "a note past the longest length is refused"
kind = "sql_expect"
actor = "root"
sql = "CREATE note:long SET author = member:idn_test, text = string::repeat('x', $note_text_max_length + 1);"
allow = false
error_contains = "string::len($value) <= $note_text_max_length"

[[cases]]
name = "a member role outside member and admin is refused"
kind = "sql_expect"
actor = "root"
sql = "CREATE member:idn_other SET role = 'owner';"
allow = false
error_contains = "$value IN"

[[cases]]
name = "alice cannot read notes"
kind = "sql_expect"
actor = "alice"
sql = "SELECT VALUE text FROM note;"
allow = true

[[cases.assertions]]
path = "0"
exists = false

[[cases]]
name = "alice cannot read members"
kind = "sql_expect"
actor = "alice"
sql = "SELECT VALUE role FROM member;"
allow = true

[[cases.assertions]]
path = "0"
exists = false

[[cases]]
name = "root stores the organisation's settings with a default language"
kind = "sql_expect"
actor = "root"
sql = "CREATE organisation_settings:ost_acme SET locale = 'es';"
allow = true

[[cases.assertions]]
path = "0.locale"
equals = "es"

[[cases]]
name = "a default language the app does not speak is refused"
kind = "sql_expect"
actor = "root"
sql = "UPDATE organisation_settings:ost_acme SET locale = 'fr';"
allow = false
error_contains = "$value IN"

[[cases]]
name = "the default language can be removed, the row staying"
kind = "sql_expect"
actor = "root"
sql = "UPDATE organisation_settings:ost_acme SET locale = NONE;"
allow = true

[[cases.assertions]]
path = "0.id"
exists = true

[[cases.assertions]]
path = "0.locale"
exists = false

[[cases]]
name = "alice cannot read the organisation's settings"
kind = "sql_expect"
actor = "alice"
sql = "SELECT VALUE locale FROM organisation_settings;"
allow = true

[[cases.assertions]]
path = "0"
exists = false

[[cases]]
name = "alice cannot write the organisation's settings"
kind = "sql_expect"
actor = "alice"
sql = "CREATE organisation_settings:ost_alice SET locale = 'en';"
allow = true

[[cases.assertions]]
path = "0"
exists = false

