name = "user-permissions"
tags = ["permissions", "user"]

# Cases run in order against one database; every actor signs up before the first case.
# The guest (unauthenticated) stance is checked over raw HTTP in tests/anonymous.

[[cases]]
name = "bob sees only himself"
kind = "sql_expect"
actor = "bob"
sql = "SELECT count() FROM user GROUP ALL;"
allow = true

[[cases.assertions]]
path = "0.count"
equals = 1

[[cases]]
name = "alice sees only herself"
kind = "sql_expect"
actor = "alice"
sql = "SELECT count() FROM user GROUP ALL;"
allow = true

[[cases.assertions]]
path = "0.count"
equals = 1

[[cases]]
name = "both users exist"
kind = "sql_expect"
actor = "root"
sql = "SELECT count() FROM user GROUP ALL;"
allow = true

[[cases.assertions]]
path = "0.count"
equals = 2

[[cases]]
name = "accounts are keyed by workspace entity ids"
kind = "sql_expect"
actor = "alice"
sql = "SELECT VALUE string::matches(record::id(id), '^usr_[0-9a-z]{16}[.][0-9a-z]{10}$') FROM user;"
allow = true

[[cases.assertions]]
path = "0"
equals = true

[[cases]]
name = "alice cannot read password hashes"
kind = "sql_expect"
actor = "alice"
sql = "SELECT VALUE password != NONE FROM user;"
allow = true

[[cases.assertions]]
path = "0"
equals = false

[[cases]]
name = "alice cannot update bob"
kind = "sql_expect"
actor = "alice"
sql = "UPDATE user SET name = 'Hacked' WHERE email = 'bob@example.test' RETURN AFTER;"
allow = true

[[cases.assertions]]
path = "0"
exists = false

[[cases]]
name = "bob keeps his name"
kind = "sql_expect"
actor = "root"
sql = "SELECT VALUE name FROM user WHERE email = 'bob@example.test';"
allow = true

[[cases.assertions]]
path = "0"
equals = "Bob"

[[cases]]
name = "alice updates her own name"
kind = "sql_expect"
actor = "alice"
sql = "UPDATE $auth.id SET name = 'Alice B' RETURN AFTER;"
allow = true

[[cases.assertions]]
path = "0.name"
equals = "Alice B"
