[defaults]
timeout_ms = 10000

[actors.root]
kind = "root"

[actors.alice]
kind = "record"
access = "user"
signup_params = { email = "alice@example.test", password = "secret-alice", name = "Alice" }
signin_params = { email = "alice@example.test", password = "secret-alice" }

[actors.bob]
kind = "record"
access = "user"
signup_params = { email = "bob@example.test", password = "secret-bob", name = "Bob" }
signin_params = { email = "bob@example.test", password = "secret-bob" }

# The signed-in user of the generated suites (`@allow record` in .surql headers).
[actors.record]
kind = "record"
access = "user"
signup_params = { email = "member@example.test", password = "secret-member", name = "Member" }
signin_params = { email = "member@example.test", password = "secret-member" }
