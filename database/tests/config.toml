[defaults]
timeout_ms = 10000

[actors.root]
kind = "root"

[actors.alice]
kind = "record"
access = "identity"
signup_params = { email = "alice@example.test", password = "secret-alice" }
signin_params = { email = "alice@example.test", password = "secret-alice" }

[actors.bob]
kind = "record"
access = "identity"
signup_params = { email = "bob@example.test", password = "secret-bob" }
signin_params = { email = "bob@example.test", password = "secret-bob" }

# The signed-in identity of the generated suites (`@allow record` in .surql headers).
[actors.record]
kind = "record"
access = "identity"
signup_params = { email = "member@example.test", password = "secret-member" }
signin_params = { email = "member@example.test", password = "secret-member" }
