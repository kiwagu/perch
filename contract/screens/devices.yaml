# yaml-language-server: $schema=../screen.schema.json
id: device
title: My devices
description: "The devices signed in to the account: this one marked, when each was last seen, signing any one of them out from here, or all of them at once."
flag: null
bindings: [ { path: /devices, guard: authenticated, roles: [ identity ], history: push } ]
entry: [ device.page.status, device.list, device.everywhere.open-button ]
anchors:
  device.page.status:
    kind: status
    description: Says the devices are being read; replaced by the list once read.
    states: [ loading ]
  device.list:
    kind: list
    description: "The devices of the account, the earliest signed in first: every device signed in, and those signed out within 30 days."
    source:
      platform: devices.list
  device.list.session-item:
    kind: item
    description: "One device: its label, when it was last seen and signed out, and its sign-out button."
    dataId: device_session
    states: [ current, revoked ]
  device.list.label-cell:
    kind: cell
    description: The label the device gave itself.
  device.list.current-badge:
    kind: badge
    description: Marks this device.
  device.list.seen-cell:
    kind: cell
    description: When the device was last seen.
  device.list.revoked-cell:
    kind: cell
    description: When the device was signed out; shown once it is.
  device.list.revoke-button:
    kind: button
    description: Signs that device out; not on this device nor on a device signed out already; disabled while a sign-out runs.
    binding:
      action: platform.devices.revoke
      params:
        device: device.list.session-item
  device.everywhere.open-button:
    kind: button
    description: Opens the dialog that signs every device out; disabled while a sign-out runs.
  device.everywhere.dialog:
    kind: dialog
    description: Asks whether to sign every device out, this one included; its confirm-button does, its cancel-button closes it.
    binding: { action: platform.sign-out-everywhere }
    codes: [ sign-out-everywhere ]
    derived: [ confirm-button, cancel-button ]
states:
  loading: "device.page.status in loading: the devices are being read; when the read fails, app-shell.notice-message says devices-read-failed and the status stays."
  ready: device.list with an item per device, this device marked, and the sign-out everywhere button.
flow:
  states:
    - viewing
    - confirming
    - signing-out
  initial: viewing
  events:
    - on: device.list.revoke-button
      action: platform.devices.revoke
      from: viewing
      params:
        device: device.list.session-item
      outcomes:
        success:
          state: viewing
          note: That device signs out; the list is read again and shows it signed out. The page is in signing-out meanwhile.
        failure:
          codes:
            - device-sign-out-failed
          state: viewing
          note: The list is read again, unless the gateway is out of reach.
    - on: device.everywhere.open-button
      from: viewing
      outcomes:
        success:
          codes:
            - sign-out-everywhere
          state: confirming
          note: device.everywhere.dialog opens.
    - on: device.everywhere.dialog.confirm-button
      action: platform.sign-out-everywhere
      from: confirming
      outcomes:
        success:
          route: /sign-in
          codes:
            - signed-out-elsewhere
          note: Every device of the account signs out, this one included; the sign-in page says resend-after-sign-in instead when this device held changes not sent yet.
        failure:
          codes:
            - device-sign-out-failed
          state: viewing
    - on: device.everywhere.dialog.cancel-button
      from: confirming
      outcomes:
        success:
          state: viewing
          note: The dialog closes.
wireframe: |-
  - heading "My devices" [level=1]
  - list:
    - listitem:
      - text: /.+/
      - text: This device
      - text: /Last seen .+/
    - listitem:
      - text: /.+/
      - text: /Last seen .+/
      - button "Sign out"
  - button "Sign out everywhere"
