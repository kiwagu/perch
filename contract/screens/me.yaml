# yaml-language-server: $schema=../screen.schema.json
id: user.profile
title: Profile
description: "The signed-in account's own profile: its name and bio, saved together and kept in step across the account's devices; signing this device out, with a warning when changes are unsent."
flag: null
bindings: [ { path: /me, guard: authenticated, roles: [ identity ], history: push } ]
entry: [ user.profile.heading, user.profile.form, user.profile.save-button ]
anchors:
  user.profile.status:
    kind: status
    description: Shown instead of the profile until it is read, and when the account has no profile.
    states: [ loading, empty ]
  user.profile.heading:
    kind: heading
    description: The name of the account, as stored.
    binding: { model: profile.name }
  user.profile.form:
    kind: form
    description: The name and the bio, saved together by one Save.
  user.profile.email-input:
    kind: input
    description: The email of the account, read-only.
    binding: { model: profile.email }
  user.profile.name-input:
    kind: input
    description: The name; its draft starts again from the stored name whenever that changes, here or on another device.
    binding: { model: profile.name }
  user.profile.bio-textarea:
    kind: textarea
    description: The bio, at most 2000 characters; its draft follows the stored bio as the name's does.
    binding: { model: profile.bio }
  user.profile.error:
    kind: error
    description: Why the last save failed, under the fields; the field it concerns is marked invalid.
    codes: [ name-required, name-too-long, bio-too-long, failed ]
  user.profile.save-button:
    kind: button
    description: Saves the name, then the bio, each only when it changed; disabled while the save runs.
    binding:
      - action: profile.updateName
        params:
          name: user.profile.name-input
      - action: profile.updateBio
        params:
          bio: user.profile.bio-textarea
  user.profile.sign-out-button:
    kind: button
    description: Signs this device out; asks first when this device holds changes it has not sent.
    binding: { action: platform.sign-out }
  user.profile.sign-out-dialog:
    kind: dialog
    description: Asks whether to sign out and lose the changes not sent; its confirm-button signs out with forgetUnsent, its cancel-button closes it.
    binding:
      action: platform.sign-out
      params:
        forgetUnsent:
          value: true
    codes: [ unsent-changes ]
    derived: [ confirm-button, cancel-button ]
states:
  loading: "user.profile.status in loading: the profile is being read."
  ready: user.profile.heading with the name, the email, the form with the name, the bio and Save, and the sign-out button.
  empty: "user.profile.status in empty: the account has no profile."
flow:
  initial: editing
  meta:
    guards:
      nameChanged: the name input differs from the stored name
      bioChanged: the bio input differs from the stored bio
      holdsUnsentChanges: this device holds changes the server has not received
  states:
    editing:
      description: The form with the stored name and bio, or the drafts of them.
      on:
        user.profile.save-button:
          - target: saving-name
            guard: nameChanged
          - target: saving-bio
            guard: bioChanged
          - description: With nothing changed, Save still says profile-saved.
            actions:
              - type: show
                params:
                  anchor: app-shell.notice-message
                  codes:
                    - profile-saved
        user.profile.sign-out-button:
          target: signing-out
    saving-name:
      description: One Save runs profile.updateName when the name changed, then profile.updateBio when the bio changed, as the binding lists them; the error is cleared, and Save is disabled meanwhile.
      invoke:
        src: profile.updateName
        input:
          name: user.profile.name-input
        onDone:
          - target: saving-bio
            guard: bioChanged
          - target: editing
            actions:
              - type: show
                params:
                  anchor: app-shell.notice-message
                  codes:
                    - profile-saved
        onError:
          target: editing
          description: The first refused write stops the save; user.profile.error shows its code until a save succeeds.
          actions:
            - type: show
              params:
                anchor: user.profile.error
                codes:
                  - name-required
                  - name-too-long
                  - bio-too-long
                  - failed
    saving-bio:
      description: profile.updateBio runs, after the name when that changed too; Save is disabled meanwhile.
      invoke:
        src: profile.updateBio
        input:
          bio: user.profile.bio-textarea
        onDone:
          target: editing
          actions:
            - type: show
              params:
                anchor: app-shell.notice-message
                codes:
                  - profile-saved
        onError:
          target: editing
          description: user.profile.error shows the code until a save succeeds.
          actions:
            - type: show
              params:
                anchor: user.profile.error
                codes:
                  - name-required
                  - name-too-long
                  - bio-too-long
                  - failed
    signing-out:
      description: The sign-out runs; it asks first when this device holds changes the server has not received.
      invoke:
        src: platform.sign-out
        onDone:
          - target: confirming
            guard: holdsUnsentChanges
            description: "Nothing changes yet: user.profile.sign-out-dialog opens."
            actions:
              - type: show
                params:
                  anchor: user.profile.sign-out-dialog
                  codes:
                    - unsent-changes
          - target: signed-out
            actions:
              - type: navigate
                params:
                  to: /sign-in
        onError:
          target: signed-out
          description: A failed sign-out also moves to the sign-in page; no code is shown.
          actions:
            - type: navigate
              params:
                to: /sign-in
    confirming:
      description: user.profile.sign-out-dialog asks whether to sign out and lose the changes not sent.
      on:
        user.profile.sign-out-dialog.confirm-button:
          target: signing-out-anyway
        user.profile.sign-out-dialog.cancel-button:
          target: editing
          description: The dialog closes.
    signing-out-anyway:
      description: The sign-out runs with forgetUnsent.
      invoke:
        src: platform.sign-out
        input:
          forgetUnsent:
            value: true
        onDone:
          target: signed-out
          description: The changes not sent are lost.
          actions:
            - type: navigate
              params:
                to: /sign-in
        onError:
          target: signed-out
          actions:
            - type: navigate
              params:
                to: /sign-in
    signed-out:
      description: The app has moved to /sign-in.
      type: final
wireframe: |-
  - heading /.+/ [level=1]
  - textbox "Email"
  - textbox "Name"
  - textbox "Bio"
  - button "Save"
  - button "Sign out"
