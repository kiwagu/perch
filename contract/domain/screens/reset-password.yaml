# yaml-language-server: $schema=../../schemas/screen.schema.json
id: user.reset-password
title: Set a new password
description: "What the link of a password reset mail opens: a new password, typed twice and kept to the rules of a new password, replaces the old one and signs every device of the account out; a link that does not work says why and leads to asking for a new one."
flag: null
bindings:
  - path: /reset-password
    roles: [ guest, identity ]
    history: push
    search:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 4096
          description: The token the reset mail carries in its link.
          examples: [ reset-token-0123456789abcdef ]
      additionalProperties: false
entry: [ user.reset-password.form, user.reset-password.password-input, user.reset-password.password-confirmation-input, user.reset-password.submit-button ]
anchors:
  user.reset-password.form:
    kind: form
    description: The form that sets the new password.
  user.reset-password.password-input:
    kind: input
    secret: true
    composite: password-rules
    description: The new password (type password).
    binding:
      action: platform.reset-password
      params:
        password: user.reset-password.password-input
    derived: [ visibility-button ]
  user.reset-password.password-confirmation-input:
    kind: input
    secret: true
    description: "The new password typed again (type password); never sent: the password is set only when the two are the same."
    derived: [ visibility-button ]
  user.reset-password.submit-button:
    kind: button
    description: "Sets the new password; disabled while the password breaks a rule, once the password typed again has strayed from it, and while it is set; a click while only a part of it is typed again says it differs and sends nothing."
    binding: { action: platform.reset-password }
  user.reset-password.message:
    kind: message
    description: "Says the password is the new one and every device of the account is signed out, beside the link to sign in."
    codes: [ password-reset ]
  user.reset-password.sign-in-link:
    kind: link
    description: Leads to the sign-in page; shown with password-reset.
    binding: { route: /sign-in }
  user.reset-password.error:
    kind: error
    description: "Why the password was not set: under the password a password it refused, under the password typed again one that differs; a link that does not work beside the link that asks for a new one."
    codes: [ link-invalid, link-expired, password-rejected, passwords-differ, rate-limited, failed ]
    fields:
      password-rejected: user.reset-password.password-input
      passwords-differ: user.reset-password.password-confirmation-input
  user.reset-password.forgot-link:
    kind: link
    description: Leads to asking for a new link; shown with link-invalid and link-expired.
    binding: { route: /forgot-password }
states:
  ready: "The form with the new password, its rules, the password typed again and the submit button."
flow:
  initial: password-weak
  meta:
    guards:
      passwordBreaksRules: the password breaks one of the rules of user.reset-password.password-rule-list
      passwordsDiffer: the password typed again is not the same as the password
      confirmationStrays: "the password typed again is no longer how the password begins: a character differs, or it is longer"
      confirmationFollows: the password typed again is how the password begins, all of it or a part, or is empty
      linkUnusable: the password was not set because the link is unknown, used before or too old
  states:
    password-weak:
      description: "The password breaks a rule: the list marks the rules it keeps, the password typed again is not judged yet, and the submit button is disabled."
      on:
        user.reset-password.password-input:
          - guard: passwordBreaksRules
            description: The list marks the rules the password keeps now.
          - target: passwords-differ
            guard: confirmationStrays
          - target: kept
    kept:
      description: The password keeps every rule; the password typed again is how it begins, or all of it.
      on:
        user.reset-password.password-input:
          - target: password-weak
            guard: passwordBreaksRules
          - target: passwords-differ
            guard: confirmationStrays
        user.reset-password.password-confirmation-input:
          target: passwords-differ
          guard: confirmationStrays
        user.reset-password.submit-button:
          - target: passwords-differ
            guard: passwordsDiffer
            description: Only a part of the password was typed again, so nothing is sent.
          - target: resetting
    passwords-differ:
      description: "The error says the password typed again differs, under it, and the submit button is disabled until the two agree again."
      entry:
        - show: { user.reset-password.error: [ passwords-differ ] }
      exit:
        - clear: user.reset-password.error
      on:
        user.reset-password.password-input:
          - target: password-weak
            guard: passwordBreaksRules
          - target: kept
            guard: confirmationFollows
        user.reset-password.password-confirmation-input:
          target: kept
          guard: confirmationFollows
    resetting:
      description: The new password is being set; the error of the last attempt goes.
      entry:
        - clear: user.reset-password.error
      invoke:
        src: platform.reset-password
        input: { token: { search: token }, password: user.reset-password.password-input }
        onDone:
          target: done
          actions:
            - show: { user.reset-password.message: [ password-reset ] }
        onError:
          - target: link-dead
            guard: linkUnusable
            description: The error says the link does not work, beside user.reset-password.forgot-link.
            actions:
              - show: user.reset-password.error
          - target: kept
            description: The error says why the password was not set; the form stays as typed.
            actions:
              - show: user.reset-password.error
    link-dead:
      description: The error says the link does not work; user.reset-password.forgot-link asks for a new one.
      type: final
    done:
      description: The message says the password is the new one and every device is signed out, beside user.reset-password.sign-in-link.
      type: final
wireframe: |-
  - heading "Set a new password" [level=1]
  - textbox "New password"
  - list
  - textbox "Confirm password"
  - button "Set the password"
