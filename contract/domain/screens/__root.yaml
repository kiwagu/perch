# yaml-language-server: $schema=../../schemas/screen.schema.json
id: app-shell
title: Application frame
description: "The frame around every screen: the readiness status, the latest notice, the toasts of what the user changed, the navigation between the screens, the theme of the device, the language choice of a guest, a way out of a device whose data will not open, a message with a reload in the place of a screen that failed to render, and a message with a reload when a newer version is served or the server no longer takes this version's protocol, and the state of this device's sync for a signed-in account."
frame: true
flag: null
bindings: []
entry: [ app-shell.status, app-shell.nav ]
anchors:
  app-shell.status:
    kind: status
    description: "The readiness line of the app: one element whose state says where the start is; in ready it is a visually hidden text, otherwise the visible message."
    states: [ opening, ready, failed, storage-blocked ]
  app-shell.notice-message:
    kind: message
    description: The latest notice for the user, one at a time; a newer notice replaces it, and it outlives the page that raised it.
    codes: [ welcome, devices-read-failed, device-sign-out-failed, change-rejected, changes-reloaded, locale-not-stored ]
  app-shell.toast:
    kind: toast
    description: "The outcome of a mutation, shown for a short while in the tab that acted: several may show at once, stacked with the newest at the top and the earlier ones moving down; a click dismisses one. It renders once per toast shown, each carrying data-code; its codes are derived, one per operation a flow runs: an action of the model, or a platform action the platform's toasts map lists."
  app-shell.nav:
    kind: nav
    description: "The main navigation: a bottom bar on small screens, a side rail on large ones; the link of the open route is marked current."
  app-shell.nav.profile-link:
    kind: link
    description: The link to the profile, shown to a signed-in account.
    binding: { route: /me }
    roles: [ identity, member, admin ]
  app-shell.nav.organisation-link:
    kind: link
    description: The link to the organisation page, shown to a signed-in account.
    binding: { route: /org }
    roles: [ identity, member, admin ]
  app-shell.nav.devices-link:
    kind: link
    description: The link to the devices of the account, shown to a signed-in account.
    binding: { route: /devices }
    roles: [ identity, member, admin ]
  app-shell.nav.settings-link:
    kind: link
    description: The link to the settings, shown to a signed-in account.
    binding: { route: /settings }
    roles: [ identity, member, admin ]
  app-shell.nav.sign-in-link:
    kind: link
    description: The link to sign-in, the only link a guest sees.
    binding: { route: /sign-in }
    roles: [ guest ]
  app-shell.theme-select:
    kind: select
    description: "The theme of this device, for anyone, a guest included: light, dark or the device's own setting; a choice applies at once and stays on this device, the same theme the settings screen chooses."
    binding:
      action: platform.theme.set
      params:
        theme: app-shell.theme-select
    dataValue: true
    derived: [ option ]
  app-shell.locale-select:
    kind: select
    description: "The language of the app for a guest, the one a new account starts with: a choice applies at once; a signed-in account chooses its language on its settings screen, and a language another device stores applies here too."
    binding:
      - model: settings.locale
      - action: settings.updateLocale
        params:
          locale: app-shell.locale-select
    roles: [ guest ]
    dataValue: true
    derived: [ option ]
  app-shell.sign-out-here-button:
    kind: button
    description: Signs the saved account out on this device when its data could not be opened; shown only in the app state failed, and the changes this device has not sent are lost.
    binding: { action: platform.sign-out }
  app-shell.crash-message:
    kind: message
    description: Shown in the place of the open screen when it failed to render, the navigation, the theme select and the language select still around it; another screen, a language chosen or a reload takes it away.
    codes: [ screen-crashed ]
  app-shell.reload-button:
    kind: button
    description: Loads the page again, shown with app-shell.crash-message.
    binding: { action: platform.reload }
  app-shell.update-message:
    kind: message
    description: "Says the page should load again: the server serves a newer version of the app, or it no longer takes the sync protocol of the version this tab runs and this device's changes stop syncing; it stays, around a crash too, until the page loads again."
    codes: [ new-version, protocol-outdated ]
  app-shell.update-button:
    kind: button
    description: Loads the page again on the version the server serves, shown with app-shell.update-message.
    binding: { action: platform.reload }
  app-shell.sync-message:
    kind: message
    description: "The state of this device's sync for a signed-in account, the same in every tab of the browser: synced, sending, connecting, offline or stopped; it goes when the account signs out, and a guest, whose data syncs nowhere, never sees it."
    codes: [ synced, sending, connecting, offline, sync-stopped ]
  app-shell.confirmation:
    kind: confirmation
    description: "Asks whether to go on with a destructive action before it runs: deleting a note, removing a member, signing another device out. It carries data-code naming the action; its confirm-button lets the action run, its cancel-button stays with nothing changed. One for the whole app: the controls that ask and its codes are derived."
    derived: [ confirm-button, cancel-button ]
  app-shell.leave-dialog:
    kind: dialog
    description: "Asks whether to leave and lose what was typed but not saved, before a leave the user starts while a field holds unsaved input: another screen, a sign-out, a switch of organisation, a change of language; its confirm-button leaves, its cancel-button stays with the input kept. A reload or a closed tab gets the browser's own prompt instead."
    codes: [ unsaved-input ]
    derived: [ confirm-button, cancel-button ]
states:
  opening: app-shell.status says the data is being opened; no screen is rendered.
  ready: The navigation, the theme select, the language select, app-shell.sync-message for a signed-in account and the open screen, with app-shell.update-message when the page should load again; app-shell.status is a visually hidden text.
  failed: app-shell.status says this device could not open the data, with app-shell.sign-out-here-button when an account is saved; no screen is rendered.
  storage-blocked: app-shell.status says the browser keeps no site data; no screen and no sign-in form.
flow:
  initial: opening
  meta:
    guards:
      signedOut: no account is signed in on this device
      storedElsewhere: the stored language is one this device neither stored nor has seen yet
      protocolTaken: the server has not refused the sync protocol of the version this tab runs since the page loaded
      quietReload: "an update waits (a newer version served, or the protocol refused, since the page loaded), no field holds unsaved input, and this tab has not loaded again by itself for the same update"
  states:
    opening:
      description: The local data is being opened; no screen is rendered.
      on:
        platform.opened: ready
        platform.open-failed: failed
        platform.storage-blocked: storage-blocked
        app-shell.locale-select:
          target: opening
          description: The app speaks the chosen language; no account's settings are open yet to store it.
        app-shell.theme-select:
          description: The app shows the chosen theme at once, and this device keeps it.
    ready:
      description: The frame with the open screen.
      on:
        app-shell.locale-select:
          - target: ready
            guard: signedOut
            description: No account is signed in, so the app speaks the chosen language with no settings to store it; a signed-in account chooses on its settings screen.
        app-shell.theme-select:
          description: The app shows the chosen theme at once, and this device keeps it.
        model.settings.locale:
          guard: storedElsewhere
          description: Another device stored a language; the app speaks it at once.
        platform.signed-out:
          description: The notice and the state of the sync go with the account.
          actions:
            - clear: app-shell.notice-message
            - clear: app-shell.sync-message
        platform.change-rejected:
          description: The notice says the server refused a change and this device undid it.
          actions:
            - show: { app-shell.notice-message: [ change-rejected ] }
        platform.changes-reloaded:
          description: The notice says the server refused the undo too, and the later unsent changes were undone.
          actions:
            - show: { app-shell.notice-message: [ changes-reloaded ] }
        platform.crashed:
          target: crashed
          description: The open screen failed to render.
        platform.new-version:
          guard: protocolTaken
          description: The message says a newer version is served, with the button that loads it; a refused protocol says more, so its message stays.
          actions:
            - show: { app-shell.update-message: [ new-version ] }
        platform.protocol-refused:
          description: The message says the server no longer takes this version's protocol, so this device's changes stop syncing until the page loads again.
          actions:
            - show: { app-shell.update-message: [ protocol-outdated ] }
        app-shell.update-button: updating
        platform.tab-hidden:
          target: updating
          guard: quietReload
          description: The tab went to the background with an update waiting and nothing unsaved, so the page loads again by itself, once.
        platform.synced:
          description: The state of the sync says it is connected and nothing waits to be sent.
          actions:
            - show: { app-shell.sync-message: [ synced ] }
        platform.sending:
          description: The state of the sync says changes made here are on their way.
          actions:
            - show: { app-shell.sync-message: [ sending ] }
        platform.connecting:
          description: The state of the sync says it connects, or connects again.
          actions:
            - show: { app-shell.sync-message: [ connecting ] }
        platform.offline:
          description: The state of the sync says the browser has no network and changes wait here.
          actions:
            - show: { app-shell.sync-message: [ offline ] }
        platform.sync-stopped:
          description: The state of the sync says it stopped and does not resume in this page.
          actions:
            - show: { app-shell.sync-message: [ sync-stopped ] }
    crashed:
      description: The open screen failed to render; the frame stays, with the navigation, the theme select and the language select.
      entry:
        - show: { app-shell.crash-message: [ screen-crashed ] }
      exit:
        - clear: app-shell.crash-message
      on:
        app-shell.reload-button: reloading
        platform.navigated:
          target: ready
          description: Another screen opens in the place of the one that failed, by a link, Back, Forward or an address typed.
        app-shell.locale-select:
          - target: ready
            guard: signedOut
            description: The screen renders again in the guest's chosen language, with no settings to store it.
        app-shell.theme-select:
          description: The app shows the chosen theme at once, the message staying, and this device keeps it.
        model.settings.locale:
          guard: storedElsewhere
          description: Another device stored a language; the app speaks it at once.
        platform.signed-out:
          description: The notice and the state of the sync go with the account.
          actions:
            - clear: app-shell.notice-message
            - clear: app-shell.sync-message
        platform.change-rejected:
          description: The notice says the server refused a change and this device undid it.
          actions:
            - show: { app-shell.notice-message: [ change-rejected ] }
        platform.changes-reloaded:
          description: The notice says the server refused the undo too, and the later unsent changes were undone.
          actions:
            - show: { app-shell.notice-message: [ changes-reloaded ] }
        platform.new-version:
          guard: protocolTaken
          description: The message says a newer version is served, the crash message staying; a refused protocol says more, so its message stays.
          actions:
            - show: { app-shell.update-message: [ new-version ] }
        platform.protocol-refused:
          description: The message says the server no longer takes this version's protocol, the crash message staying.
          actions:
            - show: { app-shell.update-message: [ protocol-outdated ] }
        app-shell.update-button: reloading
        platform.tab-hidden:
          target: reloading
          guard: quietReload
          description: The tab went to the background with an update waiting and nothing unsaved, so the page loads again by itself, once.
        platform.synced:
          description: The state of the sync says it is connected and nothing waits to be sent, the crash message staying.
          actions:
            - show: { app-shell.sync-message: [ synced ] }
        platform.sending:
          description: The state of the sync says changes made here are on their way, the crash message staying.
          actions:
            - show: { app-shell.sync-message: [ sending ] }
        platform.connecting:
          description: The state of the sync says it connects, or connects again, the crash message staying.
          actions:
            - show: { app-shell.sync-message: [ connecting ] }
        platform.offline:
          description: The state of the sync says the browser has no network and changes wait here, the crash message staying.
          actions:
            - show: { app-shell.sync-message: [ offline ] }
        platform.sync-stopped:
          description: The state of the sync says it stopped and does not resume in this page, the crash message staying.
          actions:
            - show: { app-shell.sync-message: [ sync-stopped ] }
    reloading:
      description: The page loads again from the server.
      invoke:
        src: platform.reload
        onDone:
          target: crashed
          description: Only while the page has not loaded again; the message stays.
    updating:
      description: The page loads again on the version the server serves.
      invoke:
        src: platform.reload
        onDone:
          target: ready
          description: Only while the page has not loaded again; the update message stays.
    failed:
      description: The saved account's data could not be opened; no screen is rendered.
      on:
        app-shell.sign-out-here-button: signing-out
        app-shell.locale-select:
          target: failed
          description: The app speaks the chosen language; the account's data did not open, so no settings store it.
        app-shell.theme-select:
          description: The app shows the chosen theme at once, and this device keeps it.
    signing-out:
      invoke:
        src: platform.sign-out
        onDone:
          target: signed-out
          description: The page loads again on sign-in.
          actions:
            - navigate: /sign-in
        onError:
          target: signed-out
          description: A failed sign-out also loads the sign-in page again; no code is shown.
          actions:
            - navigate: /sign-in
    storage-blocked:
      description: The browser keeps no site data, so the app stops with a message.
      type: final
    signed-out:
      description: The app has moved to /sign-in.
      type: final
wireframe: |-
  - banner:
    - text: Perch
    - combobox "Theme": As the device
    - status: Synced
    - combobox "Language": English
  - main:
    - text: Saved on this device
  - navigation "Main navigation":
    - link "Profile"
    - link "Organisation"
    - link "My devices"
    - link "Settings"
