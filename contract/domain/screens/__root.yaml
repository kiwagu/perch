# yaml-language-server: $schema=../../schemas/screen.schema.json
id: app-shell
title: Application frame
description: "The frame around every screen: the readiness status, the signed-in account's frame with its open screen while its data opens, the latest notice, the toasts of what the user changed, the navigation between the screens for a signed-in account (a guest sees none), the theme of the device, the language choice of a guest, a way out of a device whose data will not open, a message with a reload in the place of a screen that failed to render, and a message with a reload when a newer version is served or the server no longer takes this version's protocol, the state of this device's sync for a signed-in account, and a reminder to install the app until it is installed."
frame: true
flag: null
bindings: []
entry: [ app-shell.status, app-shell.nav ]
anchors:
  app-shell.status:
    kind: status
    description: "The readiness line of the app: one element whose state says where the start is; in ready it is a visually hidden text, in opening-data a visible line beside the open screen, otherwise the visible message."
    states: [ opening, opening-data, ready, failed, storage-blocked ]
  app-shell.notice-message:
    kind: message
    description: The latest notice for the user, one at a time; a newer notice replaces it, and it outlives the page that raised it.
    codes: [ welcome, devices-read-failed, device-sign-out-failed, change-rejected, changes-reloaded, locale-not-stored ]
  app-shell.toast:
    kind: toast
    description: The outcome of a mutation, shown for a short while in the tab that acted; a click dismisses one.
  app-shell.nav:
    kind: nav
    description: "The main navigation of a signed-in account: a bottom bar on small screens, a side rail on large ones; the link of the open route is marked current. A guest sees no navigation at all: the sign-in page and the page a mail's link opens lead on by their own links."
    roles: [ identity, member, admin ]
  app-shell.nav.profile-link:
    kind: link
    binding: { route: /me }
    roles: [ identity, member, admin ]
  app-shell.nav.organisation-link:
    kind: link
    binding: { route: /org }
    roles: [ identity, member, admin ]
  app-shell.nav.devices-link:
    kind: link
    binding: { route: /devices }
    roles: [ identity, member, admin ]
  app-shell.nav.settings-link:
    kind: link
    binding: { route: /settings }
    roles: [ identity, member, admin ]
  app-shell.theme-select:
    kind: select
    description: "The theme of this device, for anyone, a guest included: light, dark or the device's own setting; a choice applies at once and stays on this device, the same theme the settings screen chooses."
    binding:
      action: platform.theme.set
      params:
        theme: app-shell.theme-select
    dataValue: true
    derived: [ option ]
  app-shell.locale-select:
    kind: select
    description: "The language of the app for a guest, the one a new account starts with: a choice applies at once; a signed-in account chooses its language on its settings screen, and a language another device stores applies here too."
    binding:
      - model: settings.locale
      - action: settings.updateLocale
        params:
          locale: app-shell.locale-select
    roles: [ guest ]
    dataValue: true
    derived: [ option ]
  app-shell.sign-out-here-button:
    kind: button
    description: Signs the saved account out on this device when its data could not be opened, and the changes this device has not sent are lost.
    binding: { action: platform.sign-out }
  app-shell.crash-message:
    kind: message
    description: Shown in the place of the open screen when it failed to render, the navigation, the theme select and the language select still around it; another screen, a language chosen or a reload takes it away.
    codes: [ screen-crashed ]
  app-shell.reload-button:
    kind: button
    description: Loads the page again.
    binding: { action: platform.reload }
  app-shell.update-message:
    kind: message
    description: "Says the page should load again: the server serves a newer version of the app, or it no longer takes the sync protocol of the version this tab runs and this device's changes stop syncing; it stays, around a crash too, until the page loads again."
    codes: [ new-version, protocol-outdated ]
  app-shell.update-button:
    kind: button
    description: Loads the page again on the version the server serves, shown with app-shell.update-message.
    binding: { action: platform.reload }
  app-shell.sync-message:
    kind: message
    description: "The state of this device's sync for a signed-in account, the same in every tab of the browser: synced, sending, connecting, offline or stopped; it goes when the account signs out, and a guest, whose data syncs nowhere, never sees it."
    codes: [ synced, sending, connecting, offline, sync-stopped ]
  app-shell.install-message:
    kind: message
    description: "The reminder to install the app, for anyone, a guest included, until it is installed: with app-shell.install-button where the browser can install it, or the steps that install it where only the user can."
    codes: [ install-available, install-by-steps ]
  app-shell.install-button:
    kind: button
    description: Asks the browser to install the app, shown with app-shell.install-message where the browser can.
    binding: { action: platform.install.prompt }
  app-shell.install-later-button:
    kind: button
    description: Puts the reminder to install the app off for three days on this device, shown with app-shell.install-message.
    binding: { action: platform.install.postpone }
  app-shell.confirmation:
    kind: confirmation
    description: "Asks whether to go on with a destructive action before it runs: deleting a note, removing a member, signing another device out."
    derived: [ confirm-button, cancel-button ]
  app-shell.leave-dialog:
    kind: dialog
    description: "Asks whether to leave and lose what was typed but not saved: another screen, a sign-out, a switch of organisation, a change of language."
    codes: [ unsaved-input ]
    derived: [ confirm-button, cancel-button ]
states:
  opening: app-shell.status says the app is starting; no screen is rendered.
  opening-data: "The navigation of the signed-in account, the theme select and the open screen, whose reads wait for the account's data; app-shell.status says the data is being opened. No notice, toast, message of the sync, update or install, or crash message shows yet."
  ready: The navigation for a signed-in account, the theme select, the language select, app-shell.sync-message for a signed-in account and the open screen, with app-shell.update-message when the page should load again and app-shell.install-message until the app is installed; app-shell.status is a visually hidden text.
  failed: app-shell.status says this device could not open the data, with app-shell.sign-out-here-button when an account is saved; no screen is rendered.
  storage-blocked: app-shell.status says the browser keeps no site data; no screen and no sign-in form.
flow:
  initial: opening
  meta:
    guards:
      signedOut: no account is signed in on this device
      storedElsewhere: the stored language is one this device neither stored nor has seen yet
      protocolTaken: the server has not refused the sync protocol of the version this tab runs since the page loaded
      quietReload: "an update waits (a newer version served, or the protocol refused, since the page loaded), no field holds unsaved input, and this tab has not loaded again by itself for the same update"
  states:
    opening:
      description: "The app starts: it checks the site storage and who is signed in on this device; no screen is rendered."
      on:
        platform.started:
          - target: ready
            guard: signedOut
            description: Nobody is signed in, so there is no data to open and the screen renders at once, the sign-in form loading no database engine.
          - target: opening-data
            description: An account is signed in, so its frame and the open screen render at once while its data opens.
        platform.open-failed: failed
        platform.storage-blocked: storage-blocked
        app-shell.locale-select:
          target: opening
          description: The app speaks the chosen language; no account's settings are open yet to store it.
        app-shell.theme-select: {}
    opening-data:
      description: The signed-in account's frame and the open screen, while its local data is being opened.
      meta: { renders: [ app-shell.nav ] }
      on:
        platform.opened: ready
        platform.open-failed: failed
        app-shell.theme-select: {}
    ready:
      description: The frame with the open screen.
      meta: { renders: [ app-shell.nav ] }
      on:
        app-shell.locale-select:
          - target: ready
            guard: signedOut
            description: No account is signed in, so the app speaks the chosen language with no settings to store it; a signed-in account chooses on its settings screen.
        app-shell.theme-select: {}
        model.settings.locale:
          guard: storedElsewhere
          description: Another device stored a language; the app speaks it at once.
        platform.signed-out:
          actions:
            - clear: app-shell.notice-message
            - clear: app-shell.sync-message
        platform.change-rejected:
          actions:
            - show: { app-shell.notice-message: [ change-rejected ] }
        platform.changes-reloaded:
          actions:
            - show: { app-shell.notice-message: [ changes-reloaded ] }
        platform.crashed:
          target: crashed
          description: The open screen failed to render.
        platform.new-version:
          guard: protocolTaken
          description: A refused protocol says more, so its message stays.
          actions:
            - show: { app-shell.update-message: [ new-version ] }
        platform.protocol-refused:
          actions:
            - show: { app-shell.update-message: [ protocol-outdated ] }
        app-shell.update-button: updating
        platform.tab-hidden:
          target: updating
          guard: quietReload
        platform.synced:
          actions:
            - show: { app-shell.sync-message: [ synced ] }
        platform.sending:
          actions:
            - show: { app-shell.sync-message: [ sending ] }
        platform.connecting:
          actions:
            - show: { app-shell.sync-message: [ connecting ] }
        platform.offline:
          actions:
            - show: { app-shell.sync-message: [ offline ] }
        platform.sync-stopped:
          actions:
            - show: { app-shell.sync-message: [ sync-stopped ] }
        platform.install-offered:
          actions:
            - show: { app-shell.install-message: [ install-available ] }
        platform.install-by-steps:
          actions:
            - show: { app-shell.install-message: [ install-by-steps ] }
        platform.installed:
          actions:
            - clear: app-shell.install-message
        app-shell.install-button: installing
        app-shell.install-later-button: postponing
    crashed:
      description: The open screen failed to render; the frame stays.
      meta: { renders: [ app-shell.nav, app-shell.reload-button ] }
      entry:
        - show: { app-shell.crash-message: [ screen-crashed ] }
      exit:
        - clear: app-shell.crash-message
      on:
        app-shell.reload-button: reloading
        platform.navigated: ready
        app-shell.locale-select:
          - target: ready
            guard: signedOut
            description: The screen renders again in the guest's chosen language, with no settings to store it.
        app-shell.theme-select: {}
        model.settings.locale:
          guard: storedElsewhere
          description: Another device stored a language; the app speaks it at once.
        platform.signed-out:
          actions:
            - clear: app-shell.notice-message
            - clear: app-shell.sync-message
        platform.change-rejected:
          actions:
            - show: { app-shell.notice-message: [ change-rejected ] }
        platform.changes-reloaded:
          actions:
            - show: { app-shell.notice-message: [ changes-reloaded ] }
        platform.new-version:
          guard: protocolTaken
          description: A refused protocol says more, so its message stays.
          actions:
            - show: { app-shell.update-message: [ new-version ] }
        platform.protocol-refused:
          actions:
            - show: { app-shell.update-message: [ protocol-outdated ] }
        app-shell.update-button: reloading
        platform.tab-hidden:
          target: reloading
          guard: quietReload
        platform.synced:
          actions:
            - show: { app-shell.sync-message: [ synced ] }
        platform.sending:
          actions:
            - show: { app-shell.sync-message: [ sending ] }
        platform.connecting:
          actions:
            - show: { app-shell.sync-message: [ connecting ] }
        platform.offline:
          actions:
            - show: { app-shell.sync-message: [ offline ] }
        platform.sync-stopped:
          actions:
            - show: { app-shell.sync-message: [ sync-stopped ] }
    reloading:
      description: The page loads again from the server.
      meta: { renders: [ app-shell.nav ] }
      invoke:
        src: platform.reload
        onDone:
          target: crashed
          description: Only while the page has not loaded again; the message stays.
    updating:
      description: The page loads again on the version the server serves.
      meta: { renders: [ app-shell.nav ] }
      invoke:
        src: platform.reload
        onDone:
          target: ready
          description: Only while the page has not loaded again; the update message stays.
    installing:
      description: The browser's own window asks the user to install the app.
      meta: { renders: [ app-shell.nav ] }
      invoke:
        src: platform.install.prompt
        onDone:
          target: ready
          description: "The browser answered: installed, the reminder goes for good; declined, it is put off as by the later button."
          actions:
            - clear: app-shell.install-message
        onError:
          target: ready
          description: The browser showed no window after all; the reminder goes until the browser offers again.
          actions:
            - clear: app-shell.install-message
    postponing:
      description: The reminder is put off for three days on this device.
      meta: { renders: [ app-shell.nav ] }
      invoke:
        src: platform.install.postpone
        onDone:
          target: ready
          description: The reminder goes until three days have passed.
          actions:
            - clear: app-shell.install-message
    failed:
      description: The saved account's data could not be opened; no screen is rendered.
      meta: { renders: [ app-shell.sign-out-here-button ] }
      on:
        app-shell.sign-out-here-button: signing-out
        app-shell.locale-select:
          target: failed
          description: The app speaks the chosen language; the account's data did not open, so no settings store it.
        app-shell.theme-select: {}
    signing-out:
      meta: { renders: [ app-shell.sign-out-here-button ] }
      invoke:
        src: platform.sign-out
        onDone:
          target: signed-out
          actions:
            - navigate: /sign-in
        onError:
          target: signed-out
          description: A failed sign-out also loads the sign-in page again; no code is shown.
          actions:
            - navigate: /sign-in
    storage-blocked:
      description: The browser keeps no site data, so the app stops with a message.
      type: final
    signed-out:
      description: The app has moved to /sign-in.
      type: final
wireframe: |-
  - banner:
    - text: Perch
    - combobox "Theme": As the device
    - status: Synced
    - combobox "Language": English
  - main:
    - text: Saved on this device
  - navigation "Main navigation":
    - link "Profile"
    - link "Organisation"
    - link "My devices"
    - link "Settings"
