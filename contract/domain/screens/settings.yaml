# yaml-language-server: $schema=../../schemas/screen.schema.json
id: user.settings
title: Settings
description: "The signed-in account's settings: the theme of this device (light, dark, or the device's own), the language of the account, which follows it across its devices, and the account's password and email."
flag: null
bindings: [ { path: /settings, guard: authenticated, roles: [ identity ], history: push } ]
entry: [ user.settings.heading, user.settings.theme-select, user.settings.locale-select, user.settings.password.form, user.settings.email.form ]
anchors:
  user.settings.heading:
    kind: heading
    description: Names the screen.
  user.settings.theme-select:
    kind: select
    description: "The theme of this device: a choice applies at once and stays on this device, the device's own setting followed live while it is system."
    binding:
      action: platform.theme.set
      params:
        theme: user.settings.theme-select
    dataValue: true
    derived: [ option ]
  user.settings.locale-select:
    kind: select
    description: "The language of the account, the one its settings hold: a choice applies at once and is stored there, and the account's other devices speak it too; it takes no choice before the settings are on this device."
    binding:
      - model: settings.locale
      - action: settings.updateLocale
        params:
          locale: user.settings.locale-select
    dataValue: true
    derived: [ option ]
  user.settings.password.form:
    kind: form
    description: Changes the account's password; the account's other devices are signed out by it.
  user.settings.password.current-password-input:
    kind: input
    secret: true
    description: The password the account has now (type password).
    binding:
      action: platform.change-password
      params:
        currentPassword: user.settings.password.current-password-input
    derived: [ visibility-button ]
  user.settings.password.new-password-input:
    kind: input
    secret: true
    description: The new password (type password).
    binding:
      action: platform.change-password
      params:
        password: user.settings.password.new-password-input
    derived: [ visibility-button ]
  user.settings.password-rule-list:
    kind: list
    description: "The rules a new password keeps, under the new password, each rule marked once the password typed keeps it."
  user.settings.password-rule-list.length-item:
    kind: item
    description: 10 to 35 characters.
    states: [ met ]
  user.settings.password-rule-list.characters-item:
    kind: item
    description: "Only Latin letters, digits and the symbols ! \" # $ % & ' ( ) * + , - . / : ; < = > ? @ [ \\ ] ^ _ ` { | } ~ (no spaces); met once something is typed and every character is one of them."
    states: [ met ]
  user.settings.password-rule-list.digit-item:
    kind: item
    description: At least one digit.
    states: [ met ]
  user.settings.password-rule-list.uppercase-item:
    kind: item
    description: At least one uppercase letter.
    states: [ met ]
  user.settings.password-rule-list.lowercase-item:
    kind: item
    description: At least one lowercase letter.
    states: [ met ]
  user.settings.password-rule-list.symbol-item:
    kind: item
    description: At least one of the symbols.
    states: [ met ]
  user.settings.password.password-confirmation-input:
    kind: input
    secret: true
    description: "The new password typed again (type password); never sent: the password changes only when the two are the same."
    derived: [ visibility-button ]
  user.settings.password.save-button:
    kind: button
    description: "Changes the password; disabled while the new password breaks a rule, once the password typed again has strayed from it, and while it changes; a click while only a part of it is typed again says it differs and sends nothing."
    binding:
      action: platform.change-password
      params:
        currentPassword: user.settings.password.current-password-input
        password: user.settings.password.new-password-input
  user.settings.password.error:
    kind: error
    description: "Why the password did not change: under the current password a wrong one, under the new password one it refused, under the password typed again one that differs."
    codes: [ invalid-credentials, password-rejected, passwords-differ, rate-limited, failed ]
    fields:
      invalid-credentials: user.settings.password.current-password-input
      password-rejected: user.settings.password.new-password-input
      passwords-differ: user.settings.password.password-confirmation-input
  user.settings.email.form:
    kind: form
    description: Asks to change the account's email; the change waits for the link of the mail sent to the new email.
  user.settings.email.email-input:
    kind: input
    description: The new email (type email).
    binding:
      action: platform.change-email
      params:
        email: user.settings.email.email-input
  user.settings.email.password-input:
    kind: input
    secret: true
    description: The password the account has now (type password), which confirms the request.
    binding:
      action: platform.change-email
      params:
        password: user.settings.email.password-input
    derived: [ visibility-button ]
  user.settings.email.send-button:
    kind: button
    description: Sends the mail that confirms the new email; disabled while it is sent.
    binding:
      action: platform.change-email
      params:
        email: user.settings.email.email-input
        password: user.settings.email.password-input
  user.settings.email.message:
    kind: message
    description: "Asks to open the link of the mail sent to the new email, once the request went through; the email changes only then. A new email that has an account already gets the same words, and no mail."
    codes: [ check-your-mail ]
  user.settings.email.error:
    kind: error
    description: "Why the mail was not sent: under the password a wrong one, under the email one that is not an email."
    fields:
      invalid-credentials: user.settings.email.password-input
      email-invalid: user.settings.email.email-input
flow:
  id: settings
  description: The theme, the language, the password and the email are the regions of viewing, each in one of its states at a time.
  initial: viewing
  meta:
    guards:
      settingsHeld: the account's settings are on this device
      accountLeft: the account the store was for has signed out since it began
      passwordBreaksRules: the new password breaks one of the rules of user.settings.password-rule-list
      passwordsDiffer: the new password typed again is not the same as the new password
      confirmationStrays: "the new password typed again is no longer how the new password begins: a character differs, or it is longer"
      confirmationFollows: the new password typed again is how the new password begins, all of it or a part, or is empty
  states:
    viewing:
      type: parallel
      description: The settings of the signed-in account and of this device.
      states:
        theme:
          description: The theme of this device.
          initial: idle
          states:
            idle:
              on:
                user.settings.theme-select: applying
            applying:
              invoke:
                src: platform.theme.set
                input: { theme: user.settings.theme-select }
                onDone:
                  target: idle
                  description: The app shows the chosen theme, and this device keeps it.
        language:
          description: The language of the account.
          initial: idle
          states:
            idle:
              on:
                user.settings.locale-select:
                  target: storing
                  guard: settingsHeld
                  description: The app speaks the chosen language at once; before the account's settings arrive on this device, the select takes no choice.
            storing:
              invoke:
                src: settings.updateLocale
                input: { locale: user.settings.locale-select }
                toast: false
                onDone:
                  target: idle
                  description: The settings hold the chosen language, and the account's other devices speak it.
                onError:
                  - target: idle
                    guard: accountLeft
                    description: The account signed out meanwhile; its notice went with it, and nothing is shown.
                  - target: idle
                    description: The app keeps speaking the chosen language on this device, and the notice says the settings could not store it.
                    actions:
                      - show: { app-shell.notice-message: [ locale-not-stored ] }
        password:
          description: Changing the account's password.
          initial: password-weak
          states:
            password-weak:
              description: "The new password breaks a rule, or nothing is typed: the list marks the rules it keeps, the password typed again is not judged yet, and the save button is disabled."
              on:
                user.settings.password.new-password-input:
                  - guard: passwordBreaksRules
                    description: The list marks the rules the new password keeps now.
                  - target: passwords-differ
                    guard: confirmationStrays
                  - target: kept
            kept:
              description: The new password keeps every rule; the password typed again is how it begins, or all of it.
              on:
                user.settings.password.new-password-input:
                  - target: password-weak
                    guard: passwordBreaksRules
                  - target: passwords-differ
                    guard: confirmationStrays
                user.settings.password.password-confirmation-input:
                  target: passwords-differ
                  guard: confirmationStrays
                user.settings.password.save-button:
                  - target: passwords-differ
                    guard: passwordsDiffer
                    description: Only a part of the new password was typed again, so nothing is sent.
                  - target: changing
            passwords-differ:
              description: "The error says the password typed again differs, under it, and the save button is disabled until the two agree again."
              entry:
                - show: { user.settings.password.error: [ passwords-differ ] }
              exit:
                - clear: user.settings.password.error
              on:
                user.settings.password.new-password-input:
                  - target: password-weak
                    guard: passwordBreaksRules
                  - target: kept
                    guard: confirmationFollows
                user.settings.password.password-confirmation-input:
                  target: kept
                  guard: confirmationFollows
            changing:
              description: The password is being changed; the error of the last attempt goes.
              entry:
                - clear: user.settings.password.error
              invoke:
                src: platform.change-password
                input: { currentPassword: user.settings.password.current-password-input, password: user.settings.password.new-password-input }
                onDone:
                  target: password-weak
                  description: "The password is the new one: the toast says so, the form is emptied, and the account's other devices are signed out."
                  actions:
                    - clear: user.settings.password.current-password-input
                    - clear: user.settings.password.new-password-input
                    - clear: user.settings.password.password-confirmation-input
                onError:
                  target: kept
                  description: The error says why the password did not change; the form stays as typed.
                  actions:
                    - show: user.settings.password.error
        email:
          description: Changing the account's email.
          initial: idle
          states:
            idle:
              description: The form, nothing asked yet.
              on:
                user.settings.email.send-button: sending
            sending:
              description: The mail to the new email is being sent; the error of the last attempt goes.
              entry:
                - clear: user.settings.email.error
              invoke:
                src: platform.change-email
                input: { email: user.settings.email.email-input, password: user.settings.email.password-input }
                onDone:
                  target: sent
                  actions:
                    - show: { user.settings.email.message: [ check-your-mail ] }
                onError:
                  target: idle
                  actions:
                    - clear: user.settings.email.message
                    - show: user.settings.email.error
            sent:
              description: The message asks to open the link of the mail sent to the new email; the send button sends it again.
              on:
                user.settings.email.send-button: sending
wireframe: |-
  - heading "Settings" [level=1]
  - combobox "Theme": System
  - combobox "Language": English
  - textbox "Current password"
  - textbox "New password"
  - list
  - textbox "Confirm new password"
  - button "Change the password"
  - textbox "New email"
  - textbox "Password"
  - button "Send the confirmation"
