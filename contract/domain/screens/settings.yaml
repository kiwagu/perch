# yaml-language-server: $schema=../../schemas/screen.schema.json
id: user.settings
title: Settings
description: Where the signed-in account sets how it looks and speaks, guards and changes how it signs in, and asks to be deleted.
flag: null
bindings: [ { path: /settings, guard: authenticated, roles: [ identity ], history: push } ]
entry: [ user.settings.heading, user.settings.theme-select, user.settings.locale-select, user.settings.password.form, user.settings.email.form, user.settings.two-factor.section, user.settings.passkeys.list, user.settings.deletion.form ]
anchors:
  user.settings.heading:
    kind: heading
  user.settings.theme-select:
    kind: select
    description: "The theme of the account, stored in its settings, so its other tabs and devices show it too; it takes no choice before the settings are on this device."
    binding:
      - model: settings.theme
      - action: settings.updateTheme
        params:
          theme: user.settings.theme-select
  user.settings.locale-select:
    kind: select
    description: "The language of the account, stored in its settings, so its other devices speak it too; it takes no choice before the settings are on this device."
    binding:
      - model: settings.locale
      - action: settings.updateLocale
        params:
          locale: user.settings.locale-select
  user.settings.password.form:
    kind: form
    description: Changes the account's password.
  user.settings.password.current-password-input:
    kind: input
    secret: true
    description: The password the account has now.
    binding:
      action: platform.change-password
      params:
        currentPassword: user.settings.password.current-password-input
  user.settings.password.new-password-input:
    kind: input
    secret: true
    composite: password-rules
    description: The new password.
    binding:
      action: platform.change-password
      params:
        password: user.settings.password.new-password-input
  user.settings.password.password-confirmation-input:
    kind: input
    secret: true
    description: The new password typed again; never sent.
    confirms: user.settings.password.new-password-input
  user.settings.password.save-button:
    kind: button
    description: Changes the password.
    binding: { action: platform.change-password }
  user.settings.password.error:
    kind: error
    fields:
      invalid-credentials: user.settings.password.current-password-input
      passwords-differ: user.settings.password.password-confirmation-input
  user.settings.email.form:
    kind: form
    description: Asks to change the account's email.
  user.settings.email.email-input:
    kind: input
    description: The new email.
    binding:
      action: platform.change-email
      params:
        email: user.settings.email.email-input
  user.settings.email.password-input:
    kind: input
    secret: true
    description: The password the account has now, which confirms the request.
    binding:
      action: platform.change-email
      params:
        password: user.settings.email.password-input
  user.settings.email.send-button:
    kind: button
    description: Sends the mail that confirms the new email.
    binding: { action: platform.change-email }
  user.settings.email.message:
    kind: message
    description: Asks to open the link of the mail sent to the new email; the email changes only then.
    codes: [ check-your-mail ]
  user.settings.email.error:
    kind: error
    fields:
      invalid-credentials: user.settings.email.password-input
  user.settings.two-factor.section:
    kind: section
    description: "The account's second factor as read, on or off: a code of an authenticator app, or a backup code, asked after the password at each sign-in."
    source:
      platform: two-factor.read
    states: [ loading, ready, error ]
  user.settings.two-factor.on-badge:
    kind: badge
    description: Marks the account's second factor as on.
  user.settings.two-factor.off-badge:
    kind: badge
    description: Marks the account's second factor as off, once it was read.
  user.settings.two-factor.password-input:
    kind: input
    secret: true
    description: The password the account has now, which confirms turning the second factor on or off, or renewing its backup codes.
    binding:
      - action: platform.two-factor.enable
        params:
          password: user.settings.two-factor.password-input
      - action: platform.two-factor.disable
        params:
          password: user.settings.two-factor.password-input
      - action: platform.two-factor.renew-codes
        params:
          password: user.settings.two-factor.password-input
  user.settings.two-factor.enable-button:
    kind: button
    description: Starts turning the second factor on.
    with: [ user.settings.two-factor.off-badge ]
    binding: { action: platform.two-factor.enable }
  user.settings.two-factor.key-cell:
    kind: cell
    description: The key for the authenticator app, as text to type; a QR code beside it carries the same key to scan.
  user.settings.two-factor.code-input:
    kind: input
    description: The code the authenticator app shows now for the key.
    binding:
      action: platform.two-factor.confirm
      params:
        code: user.settings.two-factor.code-input
  user.settings.two-factor.confirm-button:
    kind: button
    description: Turns the second factor on with the code.
    binding: { action: platform.two-factor.confirm }
  user.settings.two-factor.stop-button:
    kind: button
    description: Stops turning the second factor on; it stays off.
  user.settings.two-factor.codes-cell:
    kind: cell
    description: "The ten backup codes, shown this once: each usable at most once in place of a code of the app."
  user.settings.two-factor.hide-codes-button:
    kind: button
    description: Hides the backup codes; nothing shows them again.
  user.settings.two-factor.disable-button:
    kind: button
    description: Turns the second factor off.
    with: [ user.settings.two-factor.on-badge ]
    binding: { action: platform.two-factor.disable }
  user.settings.two-factor.renew-codes-button:
    kind: button
    description: Replaces the backup codes with ten new ones, shown once.
    with: [ user.settings.two-factor.on-badge ]
    binding: { action: platform.two-factor.renew-codes }
  user.settings.two-factor.error:
    kind: error
    fields:
      invalid-credentials: user.settings.two-factor.password-input
      invalid-code: user.settings.two-factor.code-input
  user.settings.passkeys.list:
    kind: list
    description: "The account's passkeys, the earliest added first: each signs the account in from the sign-in page, with no password and no code."
    source:
      platform: passkeys.list
    states: [ loading, ready, empty, error ]
  user.settings.passkeys.passkey-item:
    kind: item
    description: One passkey, shown by when it was added.
    dataId: passkey
  user.settings.passkeys.added-cell:
    kind: cell
    description: When the passkey was added.
  user.settings.passkeys.remove-button:
    kind: button
    description: Removes that passkey; it signs nothing in from then on.
    binding:
      action: platform.passkeys.remove
      params:
        passkey: user.settings.passkeys.passkey-item
  user.settings.passkeys.add-button:
    kind: button
    description: Asks the browser to make a passkey of the account, on this device or on a security key.
    binding: { action: platform.passkeys.add }
  user.settings.passkeys.error:
    kind: error
  user.settings.deletion.form:
    kind: form
    description: "Asks to delete the account: a mail to its email carries the link of the page that deletes it."
  user.settings.deletion.password-input:
    kind: input
    secret: true
    description: The password the account has now, which confirms the request.
    binding:
      action: platform.request-account-deletion
      params:
        password: user.settings.deletion.password-input
  user.settings.deletion.send-button:
    kind: button
    description: Sends the mail whose link leads to deleting the account.
    binding: { action: platform.request-account-deletion }
  user.settings.deletion.message:
    kind: message
    description: Asks to open the link of the mail sent to the account's email; the account goes only on the press of the page it opens.
    codes: [ check-your-mail ]
  user.settings.deletion.error:
    kind: error
    fields:
      invalid-credentials: user.settings.deletion.password-input
flow:
  id: settings
  initial: viewing
  meta:
    guards:
      settingsHeld: the account's settings are on this device
      accountLeft: the account the store was for has signed out since it began
      deletionBlocked: { codes: [ last-admin ] }
      factorChanged: { codes: [ two-factor-changed ] }
  states:
    viewing:
      type: parallel
      description: The settings of the signed-in account and of this device.
      states:
        theme:
          description: The theme of the account.
          initial: idle
          states:
            idle:
              on:
                user.settings.theme-select:
                  target: storing
                  guard: settingsHeld
                  description: The app shows the chosen theme at once.
            storing:
              invoke:
                src: settings.updateTheme
                input: { theme: user.settings.theme-select }
                toast: false
                onDone:
                  target: idle
                  description: The settings hold the chosen theme, and the account's other tabs and devices show it.
                onError:
                  - target: idle
                    guard: accountLeft
                    description: The account signed out meanwhile; its notice went with it, and nothing is shown.
                  - target: idle
                    description: The app keeps showing the chosen theme on this device, and the notice says the settings could not store it.
                    actions:
                      - show: { app-shell.notice-message: [ theme-not-stored ] }
        language:
          description: The language of the account.
          initial: idle
          states:
            idle:
              on:
                user.settings.locale-select:
                  target: storing
                  guard: settingsHeld
                  description: The app speaks the chosen language at once.
            storing:
              invoke:
                src: settings.updateLocale
                input: { locale: user.settings.locale-select }
                toast: false
                onDone:
                  target: idle
                  description: The settings hold the chosen language, and the account's other devices speak it.
                onError:
                  - target: idle
                    guard: accountLeft
                    description: The account signed out meanwhile; its notice went with it, and nothing is shown.
                  - target: idle
                    description: The app keeps speaking the chosen language on this device, and the notice says the settings could not store it.
                    actions:
                      - show: { app-shell.notice-message: [ locale-not-stored ] }
        password:
          description: Changing the account's password.
          initial: password-weak
          states:
            password-weak:
              description: "The new password breaks a rule, or nothing is typed: the list marks the rules it keeps, and the password typed again is not judged yet."
              on:
                user.settings.password.new-password-input:
                  - guard: passwordBreaksRules
                    description: The list marks the rules the new password keeps now.
                  - target: passwords-differ
                    guard: confirmationStrays
                  - target: kept
            kept:
              description: The new password keeps every rule; the password typed again is how it begins, or all of it.
              on:
                user.settings.password.new-password-input:
                  - target: password-weak
                    guard: passwordBreaksRules
                  - target: passwords-differ
                    guard: confirmationStrays
                user.settings.password.password-confirmation-input:
                  target: passwords-differ
                  guard: confirmationStrays
                user.settings.password.save-button:
                  - target: passwords-differ
                    guard: passwordsDiffer
                    description: Only a part of the new password was typed again, so nothing is sent.
                  - target: changing
            passwords-differ:
              entry:
                - show: { user.settings.password.error: [ passwords-differ ] }
              exit:
                - clear: user.settings.password.error
              on:
                user.settings.password.new-password-input:
                  - target: password-weak
                    guard: passwordBreaksRules
                  - target: kept
                    guard: confirmationFollows
                user.settings.password.password-confirmation-input:
                  target: kept
                  guard: confirmationFollows
            changing:
              invoke:
                src: platform.change-password
                input: { currentPassword: user.settings.password.current-password-input, password: user.settings.password.new-password-input }
                onDone:
                  target: password-weak
                  actions:
                    - clear: user.settings.password.current-password-input
                    - clear: user.settings.password.new-password-input
                    - clear: user.settings.password.password-confirmation-input
        email:
          description: Changing the account's email.
          initial: idle
          states:
            idle:
              on:
                user.settings.email.send-button: sending
            sending:
              entry:
                - clear: user.settings.email.error
              invoke:
                src: platform.change-email
                input: { email: user.settings.email.email-input, password: user.settings.email.password-input }
                onDone:
                  target: sent
                  actions:
                    - show: { user.settings.email.message: [ check-your-mail ] }
                onError:
                  target: idle
                  actions:
                    - clear: user.settings.email.message
                    - show: user.settings.email.error
            sent:
              on:
                user.settings.email.send-button: sending
        two-factor:
          description: Turning the account's second factor on or off, or renewing its backup codes.
          initial: idle
          states:
            idle:
              meta: { renders: [ user.settings.two-factor.password-input, user.settings.two-factor.enable-button, user.settings.two-factor.disable-button, user.settings.two-factor.renew-codes-button ] }
              on:
                user.settings.two-factor.enable-button: enabling
                user.settings.two-factor.disable-button: disabling
                user.settings.two-factor.renew-codes-button: renewing
            enabling:
              meta: { renders: [ user.settings.two-factor.password-input, user.settings.two-factor.enable-button, user.settings.two-factor.disable-button, user.settings.two-factor.renew-codes-button ] }
              entry:
                - clear: user.settings.two-factor.error
              invoke:
                src: platform.two-factor.enable
                input: { password: user.settings.two-factor.password-input }
                onDone:
                  target: confirming
                  actions:
                    - clear: user.settings.two-factor.password-input
                onError:
                  - target: idle
                    guard: factorChanged
                    description: The section reads the second factor as it is now.
                    actions:
                      - show: user.settings.two-factor.error
                      - clear: user.settings.two-factor.password-input
                      - read: user.settings.two-factor.section
                  - target: idle
                    actions:
                      - show: user.settings.two-factor.error
            confirming:
              description: The key shows and waits for a code of it; the second factor is still off.
              meta: { renders: [ user.settings.two-factor.key-cell, user.settings.two-factor.code-input, user.settings.two-factor.confirm-button, user.settings.two-factor.stop-button ] }
              on:
                user.settings.two-factor.confirm-button: turning-on
                user.settings.two-factor.stop-button:
                  target: idle
                  actions:
                    - clear: user.settings.two-factor.code-input
                    - clear: user.settings.two-factor.error
            turning-on:
              meta: { renders: [ user.settings.two-factor.key-cell, user.settings.two-factor.code-input, user.settings.two-factor.confirm-button, user.settings.two-factor.stop-button ] }
              entry:
                - clear: user.settings.two-factor.error
              invoke:
                src: platform.two-factor.confirm
                input: { code: user.settings.two-factor.code-input }
                onDone:
                  target: codes
                  actions:
                    - clear: user.settings.two-factor.code-input
                    - read: user.settings.two-factor.section
                onError:
                  - target: idle
                    guard: factorChanged
                    description: The key shown was replaced or the second factor turned on elsewhere; the page leaves the key and reads the section as it is now.
                    actions:
                      - show: user.settings.two-factor.error
                      - clear: user.settings.two-factor.code-input
                      - read: user.settings.two-factor.section
                  - target: confirming
                    actions:
                      - show: user.settings.two-factor.error
            codes:
              description: The backup codes just made show until they are hidden or the page closes.
              meta: { renders: [ user.settings.two-factor.codes-cell, user.settings.two-factor.hide-codes-button ] }
              on:
                user.settings.two-factor.hide-codes-button: idle
            disabling:
              meta: { renders: [ user.settings.two-factor.password-input, user.settings.two-factor.enable-button, user.settings.two-factor.disable-button, user.settings.two-factor.renew-codes-button ] }
              entry:
                - clear: user.settings.two-factor.error
              invoke:
                src: platform.two-factor.disable
                input: { password: user.settings.two-factor.password-input }
                onDone:
                  target: idle
                  actions:
                    - clear: user.settings.two-factor.password-input
                    - read: user.settings.two-factor.section
                onError:
                  target: idle
                  actions:
                    - show: user.settings.two-factor.error
            renewing:
              meta: { renders: [ user.settings.two-factor.password-input, user.settings.two-factor.enable-button, user.settings.two-factor.disable-button, user.settings.two-factor.renew-codes-button ] }
              entry:
                - clear: user.settings.two-factor.error
              invoke:
                src: platform.two-factor.renew-codes
                input: { password: user.settings.two-factor.password-input }
                onDone:
                  target: codes
                  actions:
                    - clear: user.settings.two-factor.password-input
                onError:
                  - target: idle
                    guard: factorChanged
                    description: The section reads the second factor as it is now.
                    actions:
                      - show: user.settings.two-factor.error
                      - clear: user.settings.two-factor.password-input
                      - read: user.settings.two-factor.section
                  - target: idle
                    actions:
                      - show: user.settings.two-factor.error
        passkey-add:
          description: Adding a passkey.
          by: user.settings.passkeys.add-button
          onDone:
            actions:
              - read: user.settings.passkeys.list
          onError:
            actions:
              - show: user.settings.passkeys.error
        passkey-remove:
          description: Removing a passkey.
          by: user.settings.passkeys.remove-button
          onDone:
            actions:
              - read: user.settings.passkeys.list
          onError:
            actions:
              - show: user.settings.passkeys.error
              - read: user.settings.passkeys.list
        deletion:
          description: Asking to delete the account.
          initial: idle
          states:
            idle:
              on:
                user.settings.deletion.send-button: sending
            sending:
              entry:
                - clear: user.settings.deletion.error
              invoke:
                src: platform.request-account-deletion
                input: { password: user.settings.deletion.password-input }
                onDone:
                  target: sent
                  actions:
                    - show: { user.settings.deletion.message: [ check-your-mail ] }
                    - clear: user.settings.deletion.password-input
                onError:
                  - target: idle
                    guard: deletionBlocked
                    description: The password was right, but the account is the only admin of an organisation with other members, so the password is emptied and leaving for the organisation page asks nothing.
                    actions:
                      - clear: user.settings.deletion.message
                      - show: user.settings.deletion.error
                      - clear: user.settings.deletion.password-input
                  - target: idle
                    actions:
                      - clear: user.settings.deletion.message
                      - show: user.settings.deletion.error
            sent:
              description: The mail is on its way; a second press sends a fresh link, which replaces the first.
              on:
                user.settings.deletion.send-button: sending
wireframe: |-
  - heading "Settings" [level=1]
  - combobox "Theme": System
  - combobox "Language": English
  - textbox "Current password"
  - textbox "New password"
  - list
  - textbox "Confirm new password"
  - button "Change the password"
  - textbox "New email"
  - textbox "Password"
  - button "Send the confirmation"
  - textbox "Password"
  - button "Turn on the second factor"
  - list
  - button "Add a passkey"
  - textbox "Password"
  - button "Send the deletion link"
