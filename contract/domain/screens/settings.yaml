# yaml-language-server: $schema=../../schemas/screen.schema.json
id: user.settings
title: Settings
description: "The signed-in account's settings: the theme of this device (light, dark, or the device's own), the language of the account, which follows it across its devices, and the account's password and email."
flag: null
bindings: [ { path: /settings, guard: authenticated, roles: [ identity ], history: push } ]
entry: [ user.settings.heading, user.settings.theme-select, user.settings.locale-select, user.settings.password.form, user.settings.email.form ]
anchors:
  user.settings.heading:
    kind: heading
  user.settings.theme-select:
    kind: select
    description: The theme of this device, kept on this device.
    binding:
      action: platform.theme.set
      params:
        theme: user.settings.theme-select
    dataValue: true
    derived: [ option ]
  user.settings.locale-select:
    kind: select
    description: "The language of the account, stored in its settings, so its other devices speak it too; it takes no choice before the settings are on this device."
    binding:
      - model: settings.locale
      - action: settings.updateLocale
        params:
          locale: user.settings.locale-select
    dataValue: true
    derived: [ option ]
  user.settings.password.form:
    kind: form
    description: Changes the account's password.
  user.settings.password.current-password-input:
    kind: input
    secret: true
    description: The password the account has now.
    binding:
      action: platform.change-password
      params:
        currentPassword: user.settings.password.current-password-input
    derived: [ visibility-button ]
  user.settings.password.new-password-input:
    kind: input
    secret: true
    composite: password-rules
    description: The new password.
    binding:
      action: platform.change-password
      params:
        password: user.settings.password.new-password-input
    derived: [ visibility-button ]
  user.settings.password.password-confirmation-input:
    kind: input
    secret: true
    description: The new password typed again; never sent.
    derived: [ visibility-button ]
  user.settings.password.save-button:
    kind: button
    description: Changes the password.
    binding: { action: platform.change-password }
  user.settings.password.error:
    kind: error
    fields:
      invalid-credentials: user.settings.password.current-password-input
      password-rejected: user.settings.password.new-password-input
      passwords-differ: user.settings.password.password-confirmation-input
  user.settings.email.form:
    kind: form
    description: Asks to change the account's email.
  user.settings.email.email-input:
    kind: input
    description: The new email (type email).
    binding:
      action: platform.change-email
      params:
        email: user.settings.email.email-input
  user.settings.email.password-input:
    kind: input
    secret: true
    description: The password the account has now, which confirms the request.
    binding:
      action: platform.change-email
      params:
        password: user.settings.email.password-input
    derived: [ visibility-button ]
  user.settings.email.send-button:
    kind: button
    description: Sends the mail that confirms the new email.
    binding: { action: platform.change-email }
  user.settings.email.message:
    kind: message
    description: Asks to open the link of the mail sent to the new email; the email changes only then.
    codes: [ check-your-mail ]
  user.settings.email.error:
    kind: error
    fields:
      invalid-credentials: user.settings.email.password-input
      email-invalid: user.settings.email.email-input
flow:
  id: settings
  initial: viewing
  meta:
    guards:
      settingsHeld: the account's settings are on this device
      accountLeft: the account the store was for has signed out since it began
      passwordBreaksRules: the new password breaks one of the rules of user.settings.password-rule-list
      passwordsDiffer: the new password typed again is not the same as the new password
      confirmationStrays: "the new password typed again is no longer how the new password begins: a character differs, or it is longer"
      confirmationFollows: the new password typed again is how the new password begins, all of it or a part, or is empty
  states:
    viewing:
      type: parallel
      description: The settings of the signed-in account and of this device.
      states:
        theme:
          description: The theme of this device.
          initial: idle
          states:
            idle:
              on:
                user.settings.theme-select: applying
            applying:
              invoke:
                src: platform.theme.set
                input: { theme: user.settings.theme-select }
                onDone:
                  target: idle
        language:
          description: The language of the account.
          initial: idle
          states:
            idle:
              on:
                user.settings.locale-select:
                  target: storing
                  guard: settingsHeld
                  description: The app speaks the chosen language at once.
            storing:
              invoke:
                src: settings.updateLocale
                input: { locale: user.settings.locale-select }
                toast: false
                onDone:
                  target: idle
                  description: The settings hold the chosen language, and the account's other devices speak it.
                onError:
                  - target: idle
                    guard: accountLeft
                    description: The account signed out meanwhile; its notice went with it, and nothing is shown.
                  - target: idle
                    description: The app keeps speaking the chosen language on this device, and the notice says the settings could not store it.
                    actions:
                      - show: { app-shell.notice-message: [ locale-not-stored ] }
        password:
          description: Changing the account's password.
          initial: password-weak
          states:
            password-weak:
              description: "The new password breaks a rule, or nothing is typed: the list marks the rules it keeps, and the password typed again is not judged yet."
              on:
                user.settings.password.new-password-input:
                  - guard: passwordBreaksRules
                    description: The list marks the rules the new password keeps now.
                  - target: passwords-differ
                    guard: confirmationStrays
                  - target: kept
            kept:
              description: The new password keeps every rule; the password typed again is how it begins, or all of it.
              on:
                user.settings.password.new-password-input:
                  - target: password-weak
                    guard: passwordBreaksRules
                  - target: passwords-differ
                    guard: confirmationStrays
                user.settings.password.password-confirmation-input:
                  target: passwords-differ
                  guard: confirmationStrays
                user.settings.password.save-button:
                  - target: passwords-differ
                    guard: passwordsDiffer
                    description: Only a part of the new password was typed again, so nothing is sent.
                  - target: changing
            passwords-differ:
              entry:
                - show: { user.settings.password.error: [ passwords-differ ] }
              exit:
                - clear: user.settings.password.error
              on:
                user.settings.password.new-password-input:
                  - target: password-weak
                    guard: passwordBreaksRules
                  - target: kept
                    guard: confirmationFollows
                user.settings.password.password-confirmation-input:
                  target: kept
                  guard: confirmationFollows
            changing:
              invoke:
                src: platform.change-password
                input: { currentPassword: user.settings.password.current-password-input, password: user.settings.password.new-password-input }
                onDone:
                  target: password-weak
                  actions:
                    - clear: user.settings.password.current-password-input
                    - clear: user.settings.password.new-password-input
                    - clear: user.settings.password.password-confirmation-input
        email:
          description: Changing the account's email.
          initial: idle
          states:
            idle:
              on:
                user.settings.email.send-button: sending
            sending:
              entry:
                - clear: user.settings.email.error
              invoke:
                src: platform.change-email
                input: { email: user.settings.email.email-input, password: user.settings.email.password-input }
                onDone:
                  target: sent
                  actions:
                    - show: { user.settings.email.message: [ check-your-mail ] }
                onError:
                  target: idle
                  actions:
                    - clear: user.settings.email.message
                    - show: user.settings.email.error
            sent:
              on:
                user.settings.email.send-button: sending
wireframe: |-
  - heading "Settings" [level=1]
  - combobox "Theme": System
  - combobox "Language": English
  - textbox "Current password"
  - textbox "New password"
  - list
  - textbox "Confirm new password"
  - button "Change the password"
  - textbox "New email"
  - textbox "Password"
  - button "Send the confirmation"
