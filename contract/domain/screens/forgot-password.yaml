# yaml-language-server: $schema=../../schemas/screen.schema.json
id: user.forgot-password
title: Forgot the password
description: "Where a visitor who forgot the password asks for a mail whose link sets a new one; any email gets the same answer, so the page tells nobody which emails have accounts."
flag: null
bindings:
  - path: /forgot-password
    roles: [ guest, identity ]
    history: push
    search:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
          description: The email typed on the sign-in page, carried over.
          examples: [ ann@example.test ]
      additionalProperties: false
entry: [ user.forgot-password.form, user.forgot-password.email-input, user.forgot-password.send-button ]
anchors:
  user.forgot-password.form:
    kind: form
    description: The form that asks for the mail.
  user.forgot-password.email-input:
    kind: input
    description: "The email of the account (type email); it starts with the email the sign-in page carried over, when there is one."
    binding:
      - search: email
      - action: platform.request-password-reset
        params:
          email: user.forgot-password.email-input
  user.forgot-password.send-button:
    kind: button
    description: Asks for the mail; disabled while it is asked for.
    binding: { action: platform.request-password-reset }
  user.forgot-password.message:
    kind: message
    description: "Asks to open the link of the mail that sets a new password, once the request went through; an email that has no account gets the same words, and no mail."
    codes: [ check-your-mail ]
  user.forgot-password.error:
    kind: error
    description: Why the mail was not asked for; the next attempt clears it.
  user.forgot-password.sign-in-link:
    kind: link
    description: Leads back to the sign-in page.
    binding: { route: /sign-in }
states:
  ready: "The form with the email input and the send button, and the link back to the sign-in page."
flow:
  initial: idle
  states:
    idle:
      description: The form, nothing asked yet.
      on:
        user.forgot-password.send-button: sending
    sending:
      description: The mail is asked for; the error of the last attempt goes.
      entry:
        - clear: user.forgot-password.error
      invoke:
        src: platform.request-password-reset
        input: { email: user.forgot-password.email-input }
        onDone:
          target: sent
          actions:
            - show: { user.forgot-password.message: [ check-your-mail ] }
        onError:
          target: idle
          actions:
            - clear: user.forgot-password.message
            - show: user.forgot-password.error
    sent:
      description: The message asks to open the link of the mail; the send button asks for it again.
      on:
        user.forgot-password.send-button: sending
wireframe: |-
  - heading "Forgot your password?" [level=1]
  - textbox "Email"
  - button "Send the link"
  - link "Back to sign in"
