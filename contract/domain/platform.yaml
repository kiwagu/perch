# yaml-language-server: $schema=../schemas/platform.schema.json
version: 1
actions:
  sign-up:
    description: Creates an account with its name and its language, and sends the mail whose link verifies its email; this device is not signed in.
    params:
      email:
        type: string
        description: The email of the new account.
      password:
        type: string
        description: The password of the new account, kept to the composite password-rules; one that breaks them is refused with sign-up-rejected. An account made before these rules keeps signing in with its password.
      name:
        type: string
        description: The name of the profile, 1 to 80 characters.
      locale:
        type: string
        description: The language the new account's mails speak and its settings start with.
    result: "the account is created and the mail below is sent to it; the device is not signed in, and /sign-in asks to check the mail; an email that has an account already gets the same answer and no mail"
    codes:
      - sign-up-rejected
      - rate-limited
      - name-required
      - name-too-long
      - failed
    mail:
      to: email
      language: locale
      link: { screen: user.verify-email, search: token }
  sign-in:
    description: Signs this device in to an account whose email is verified.
    params:
      email:
        type: string
        description: The email of the account.
      password:
        type: string
        description: The password of the account.
      signOutOldest:
        type: boolean
        description: "Optional: sign in past the account's limit of devices, signing out its device seen least recently, but only when this device would otherwise be one too many."
    result: the device is signed in, the app moves to /me with code welcome; the first sign-in of an account whose email was verified without a device signing in (by a password reset, by its verification link opened while it was banned, or by an operator's email change confirmed) also creates its settings (its language as it signed up) and profile (its name as it signed up), as the link of the sign-up mail would have; an account whose email is not verified yet is refused with email-not-verified and nothing is sent; an account is signed in on ten devices at most at once, each counted once while its session lasts, so a sign-in on one more device asks first (dialog device-limit) and signs nothing in; with signOutOldest it signs this device in and signs out the one seen least recently only when the account would otherwise be on more than ten devices; an account an operator banned is refused with account-banned once its password is right, so nobody without the password learns of the ban, and nothing is signed in
    codes:
      - invalid-credentials
      - email-not-verified
      - account-banned
      - rate-limited
      - other-account
      - failed
  verify-email:
    description: Verifies the email of an account with the token its verification mail carries, and signs this device in to the account the first time.
    params:
      token:
        type: string
        description: The token the link of the verification mail carries in the address of /verify-email.
    result: "the first time, the email is verified, this device is signed in, the account's settings (its language as it signed up) and profile (its name as it signed up) are created, and the app moves to /me with code welcome; a link opened once the email is verified, by an earlier opening or by a password reset, answers verified-before, signs nothing in and creates nothing; a link older than a day answers link-expired; a link of an account an operator banned verifies the email, signs nothing in, creates nothing, and answers account-banned; the account's first sign-in once the ban is lifted creates its settings and profile"
    codes:
      - link-invalid
      - link-expired
      - account-banned
      - other-account
      - rate-limited
      - failed
  resend-verification:
    description: Sends the mail whose link verifies an account's email again.
    params:
      email:
        type: string
        description: The email of the account.
    result: "the mail below is on its way when the email has an account not verified yet; an unknown email, or one verified already, gets the same answer and no mail; one email takes three resends within a quarter of an hour, and a fourth answers rate-limited and sends nothing"
    codes:
      - rate-limited
      - failed
    mail:
      to: email
      language: account
      link: { screen: user.verify-email, search: token }
  request-password-reset:
    description: Sends the mail whose link sets a new password for an account.
    params:
      email:
        type: string
        description: The email of the account.
    result: "the mail below is on its way when the email has an account, and its link replaces the links of earlier requests, so only the newest works; an unknown email gets the same answer, in the same time, and no mail, so the answer tells nobody which emails have accounts; one email takes three requests within a quarter of an hour, and a fourth answers rate-limited and sends nothing; the mails count toward the network address's budget of mails, shared with sign-up and the resend of a verification mail"
    codes:
      - rate-limited
      - failed
    mail:
      to: email
      language: account
      link: { screen: user.reset-password, search: token }
  reset-password:
    description: Sets a new password for an account with the token its reset mail carries, and signs every device of the account out.
    params:
      token:
        type: string
        description: The token the link of the reset mail carries in the address of /reset-password.
      password:
        type: string
        description: The new password, kept to the composite password-rules.
    result: "the account's password is the new one, its email is verified when it was not yet, since only that mailbox got the link (its first sign-in then creates the account's settings and profile, as the link of the sign-up mail would have), every other reset link of the account stops working, and every device signed in to the account is signed out, this one too when it is: the page then keeps its message; nothing is signed in by it. A link unknown, used before or replaced by a newer one answers link-invalid, one older than an hour link-expired, and a password that breaks the rules password-rejected, the old password then unchanged. A network address takes twenty attempts within ten minutes, refused or not, and the next answers rate-limited"
    codes:
      - link-invalid
      - link-expired
      - password-rejected
      - rate-limited
      - failed
    notices:
      - name: password-changed
        to: account
        language: account
        link: { screen: user.forgot-password }
  change-password:
    description: Changes the signed-in account's password, signing its other devices out.
    params:
      currentPassword:
        type: string
        description: The password the account has now.
      password:
        type: string
        description: The new password, kept to the composite password-rules.
    result: "the password is the new one, every reset link of the account stops working, every other device of the account is signed out and this one stays signed in; a wrong current password answers invalid-credentials and counts toward the account's failed sign-ins, ten within a quarter of an hour, after which it answers rate-limited until the quarter of an hour has passed; a password that breaks the rules answers password-rejected; the password stays unchanged on any refusal"
    codes:
      - invalid-credentials
      - password-rejected
      - rate-limited
      - failed
    notices:
      - name: password-changed
        to: account
        language: account
        link: { screen: user.forgot-password }
  change-email:
    description: Asks to change the signed-in account's email; the mail below goes to the new email, and its link makes the change.
    params:
      email:
        type: string
        description: The new email.
      password:
        type: string
        description: The password the account has now, which confirms the request.
    result: "the mail below is on its way to the new email, its link replacing the link of an earlier request, and the account keeps its email until that link is opened; a new email that has an account already gets the same answer, in the same time, and no mail; a wrong password answers invalid-credentials and counts toward the account's failed sign-ins as for change-password; one account asks three changes within a quarter of an hour, and a fourth answers rate-limited and sends nothing; an email that is not an email answers email-invalid; the mails count toward the network address's budget of mails"
    codes:
      - invalid-credentials
      - email-invalid
      - rate-limited
      - failed
    mail:
      to: email
      language: account
      link: { screen: user.confirm-email, search: token }
  confirm-email:
    description: Changes an account's email to the new one, with the token the link of its confirmation mail carries.
    params:
      token:
        type: string
        description: The token the link of the confirmation mail carries in the address of /confirm-email.
    result: "the account's email is the new one, which signs it in from now on, and every device of the account shows it; every reset link of the account stops working, since it went to the old email; the old email gets the notice below, which names neither the new email nor any part of it; the device that opens the link is not signed in by it. A link unknown, used before or replaced by a newer one, one whose account changed its email or its password since the mail was sent, or one whose new email has got an account meanwhile, answers link-invalid; one older than a day link-expired. A network address takes twenty attempts within ten minutes, and the next answers rate-limited"
    codes:
      - link-invalid
      - link-expired
      - rate-limited
      - failed
    notices:
      - name: email-changed
        to: account
        language: account
  request-account-deletion:
    description: Asks to delete the signed-in account; the mail below goes to its email, and the page its link opens deletes the account on a press.
    params:
      password:
        type: string
        description: The password the account has now, which confirms the request.
    result: "the mail below is on its way to the account's email, its link replacing the link of an earlier request, and the account stays as it is until the button of the page that link opens is pressed; a wrong password answers invalid-credentials and counts toward the account's failed sign-ins as for change-password; an account that is the only administrator of an organisation with other members answers last-admin and sends nothing, until another member of it is made an administrator or those members are removed; one account asks three deletions within a quarter of an hour, and a fourth answers rate-limited and sends nothing; the mails count toward the network address's budget of mails"
    codes:
      - invalid-credentials
      - last-admin
      - rate-limited
      - failed
    mail:
      to: account
      language: account
      link: { screen: user.delete-account, search: token }
  delete-account:
    description: Deletes an account for good, with the token the link of its deletion mail carries, on the press of the page's button.
    params:
      token:
        type: string
        description: The token the link of the deletion mail carries in the address of /delete-account.
    result: "the account is gone for good, with its profile and its settings, its sessions, so every device of the account is signed out, this one too when it is, and its memberships; each organisation it was the only member of goes with it, its data too; the other organisations keep what it wrote there, without it as a member; its email can sign up again at once, and gets the notice below; nothing brings the account back. A link unknown, used before or replaced by a newer one, or one whose account changed its password or its email since the mail was sent, answers link-invalid; one older than an hour link-expired, since what it does cannot be undone; an account that became the only administrator of an organisation with other members since the mail was sent answers last-admin and deletes nothing. A network address takes twenty attempts within ten minutes, and the next answers rate-limited"
    codes:
      - link-invalid
      - link-expired
      - last-admin
      - rate-limited
      - failed
    notices:
      - name: account-deleted
        to: account
        language: account
  sign-out:
    description: Signs this device out, after sending what it can.
    params:
      forgetUnsent:
        type: boolean
        description: "Optional: sign out even though this device holds changes the server has not received; they are lost."
    result: this device signs out, its local data goes, the app moves to /sign-in; with unsent changes and no forgetUnsent the sign-out asks first (dialog unsent-changes) and changes nothing; it waits a few seconds for the sync channel first, except when the browser says it has no network, where it answers at once
    codes:
      - failed
  sign-out-everywhere:
    description: Signs every device of the account out, this one included.
    params: {}
    result: every device of the account signs out, this one included; /sign-in shows signed-out-elsewhere
    codes:
      - device-sign-out-failed
  devices.list:
    description: Reads the devices of the account.
    params: {}
    result: "the account's devices: for each its device session id, label, last seen, when it was revoked, and whether it is the current device"
    codes:
      - devices-read-failed
  devices.revoke:
    description: Signs another device of the account out.
    params:
      device:
        type: string
        description: The device session id of that device.
    result: that device signs out; the answer lists the account's devices as they are then, or none when they could not be read
    codes:
      - device-sign-out-failed
  theme.set:
    description: Shows the app in a theme on this device and keeps it there.
    params:
      theme:
        type: string
        description: "light, dark, or system: the device's own setting, followed as it changes."
    result: the app shows the theme at once and this device keeps it; the other tabs of this browser where no account is signed in show it too
    codes: []
  reload:
    description: Loads the page again from the server.
    params: {}
    result: the page loads again; what this tab held and had not stored is gone
    codes: []
  install.prompt:
    description: Shows the browser's own window that installs the app, where the browser offers one.
    params: {}
    result: the browser asks the user; installed, the app opens as the installed app and the reminder goes for good on this device; declined, the reminder is put off as by install.postpone
    codes: []
  install.postpone:
    description: Puts the reminder to install the app off on this device.
    params: {}
    result: the reminder goes, and comes back after three days on this device
    codes: []
  organisations.create:
    description: Creates an organisation.
    params:
      key:
        type: string
        description: The key of the organisation, ^[a-z][a-z0-9_]{1,31}$.
      name:
        type: string
        description: The name of the organisation, 1 to 80 characters.
    result: the organisation exists with the caller as admin and becomes current
    codes:
      - key-invalid
      - name-required
      - name-too-long
      - key-taken
      - rate-limited
      - failed
  organisations.select:
    description: Makes one of the account's organisations current on this device.
    params:
      key:
        type: string
        description: The key of an organisation the account belongs to.
    result: the organisation becomes current on this device (no server call); the choice is kept on this browser
    codes: []
  organisations.members:
    description: Reads the members of the current organisation.
    params: {}
    result: its members with their identity id, email and role
    codes:
      - not-admin
      - failed
    roles:
      - admin
  organisations.invite:
    description: Invites an email to the current organisation with a role; a mail carries the link that accepts it.
    params:
      email:
        type: string
        description: The email the invitation is for; it needs no account yet.
      role:
        type: string
        description: "member or admin: the role the account takes when it accepts."
    result: "an invitation of the email with the role, pending for seven days, and the mail below on its way to the email; an email with an account and one without get the same answer, in the same time; inviting an email again replaces its pending invitation, whose link stops working; the email of a member answers already-member; the email is a member only once the account with that email accepts; the mails count toward the network address's budget of mails"
    codes:
      - already-member
      - email-invalid
      - not-admin
      - rate-limited
      - failed
    roles:
      - admin
    mail:
      to: email
      language: recipient
      link: { screen: organisation.invitation, search: token }
  organisations.invitations:
    description: Reads the pending invitations of the current organisation.
    params: {}
    result: its invitations not accepted, declined, revoked or expired yet, the newest first, each with its id, email, role and link
    codes:
      - not-admin
      - failed
    roles:
      - admin
  organisations.copy-invitation:
    description: Puts the link of a pending invitation on this device's clipboard, to send it another way than the mail.
    params:
      invitation:
        type: string
        description: The id of the invitation.
    result: the link is on the clipboard (no server call); it is the link the mail carries, and works for the invited email alone
    codes:
      - failed
    roles:
      - admin
  organisations.revoke-invitation:
    description: Revokes a pending invitation of the current organisation.
    params:
      invitation:
        type: string
        description: The id of the invitation.
    result: the invitation is gone and its link stops working
    codes:
      - not-admin
      - failed
    roles:
      - admin
  organisations.set-role:
    description: Changes the role of a member of the current organisation.
    params:
      identity:
        type: string
        description: The identity id of the member.
      role:
        type: string
        description: member or admin.
    result: "the member has the role from now on: its devices show it without a reload, and the next change they send is judged by it; an administrator may make itself a member while another administrator stays; the only administrator of the organisation answers last-admin and keeps its role"
    codes:
      - not-admin
      - last-admin
      - failed
    roles:
      - admin
  invitations.read:
    description: Reads the invitation a link carries, for the page the link opens.
    params:
      token:
        type: string
        description: The token the link of the invitation mail carries in the address of /invitation.
    result: "the organisation's name, the role, and whether the invitation is for the account signed in on this device, whose email is then the invitation's; never the email. A link unknown, used, declined, revoked or replaced by a newer one, or whose organisation is gone, answers link-invalid; one older than seven days link-expired. A network address takes twenty attempts within ten minutes, and the next answers rate-limited"
    codes:
      - link-invalid
      - link-expired
      - rate-limited
      - failed
  invitations.mine:
    description: Reads the invitations to the signed-in account's email.
    params: {}
    result: the pending invitations to the account's email, of organisations it is not a member of, the newest first, each with its id, the organisation's name and the role
    codes:
      - failed
  invitations.accept:
    description: Accepts an invitation to the signed-in account's email.
    params:
      invitation:
        type: string
        description: "The invitation: its id, as the invitations for the account list it, or the token its link carries."
    result: "the account is a member of the invitation's organisation with its role, that organisation becomes current on this device, the account's devices learn it without a reload, and the invitation is spent; an invitation to another email answers other-account; one revoked, replaced, declined, accepted or expired meanwhile invitation-gone; an account that is a member already already-member"
    codes:
      - invitation-gone
      - other-account
      - already-member
      - failed
  invitations.decline:
    description: Declines an invitation to the signed-in account's email.
    params:
      invitation:
        type: string
        description: "The invitation: its id, as the invitations for the account list it, or the token its link carries."
    result: the invitation is gone and its link stops working; an invitation to another email answers other-account, and one gone meanwhile invitation-gone
    codes:
      - invitation-gone
      - other-account
      - failed
  organisations.remove:
    description: Removes a member from the current organisation.
    params:
      identity:
        type: string
        description: The identity id of the member.
    result: the member is removed; its devices lose the organisation without a reload
    codes:
      - not-admin
      - failed
    roles:
      - admin
  accounts.list:
    description: Reads a page of the platform's accounts, found by a part of their email or name, for an operator.
    params:
      q:
        type: string
        description: "Optional: a part of the email or of the name, matched whatever its case; absent or empty, every account."
      page:
        type: number
        description: The page, from 1.
      size:
        type: number
        description: "The accounts a page holds: one of the sizes below."
    result: "the accounts the search finds, the newest first (two made at the same moment by their id), that page of them and their number in all: for each its identity id, its name (its profile's, or the one it signed up with while it has no profile), its email, whether the email is verified, whether it is banned, whether it is an operator, and when it was made; a page past the last holds none"
    codes:
      - not-operator
      - failed
    roles:
      - operator
    paged: { sizes: [ 10, 25, 50 ], default: 25 }
  accounts.read:
    description: Reads one account for an operator, with its organisations.
    params:
      id:
        type: string
        description: The identity id of the account.
    result: "the account: its identity id, name (as accounts.list names it), email, whether the email is verified, when it was made, whether it has a profile (none until its first sign-in, so its name is the one it signed up with), when one of its devices was last seen among its sessions still kept (none, never), whether it is an operator, whether it is banned and the reason given, and its organisations, each with its key, its name and the account's role in it; an id with no account answers account-gone"
    codes:
      - not-operator
      - account-gone
      - failed
    roles:
      - operator
  accounts.rename:
    description: Sets the name of an account's profile, as the account's own profile page would.
    params:
      id:
        type: string
        description: The identity id of the account.
      name:
        type: string
        description: The name, 1 to 80 characters.
    result: "the profile's name is the new one, and the account's devices show it as they show any change of the profile; an account with no profile yet (it never signed in) has no name to set, so the card offers no rename then"
    codes:
      - name-required
      - name-too-long
      - not-operator
      - account-gone
      - failed
    roles:
      - operator
  accounts.change-email:
    description: Asks to change an account's email for it; the mail below goes to the new email, and its link makes the change.
    params:
      id:
        type: string
        description: The identity id of the account.
      email:
        type: string
        description: The new email.
    result: "the mail below is on its way to the new email, its link replacing the link of an earlier request, by the account or by an operator, and the account keeps its email until that link is opened, which also marks the new email verified, so an account that never signed in starts at its first sign-in with the new email; a new email that has an account answers email-taken and sends nothing, and one that is not an email email-invalid; the mails count toward the operator's network address's budget of mails"
    codes:
      - email-invalid
      - email-taken
      - rate-limited
      - not-operator
      - account-gone
      - failed
    roles:
      - operator
    mail:
      to: email
      language: account
      link: { screen: user.confirm-email, search: token }
  accounts.ban:
    description: Bans an account until an operator lifts the ban, with a reason for operators alone, and signs its devices out.
    params:
      id:
        type: string
        description: The identity id of the account.
      reason:
        type: string
        description: "Optional: why, for operators alone; the account never sees it."
    result: "the account is banned and every device of it is signed out in the same step, so each lands on /sign-in told account-banned, and a sign-in with the right password answers account-banned until accounts.unban; an account banned already keeps its ban, with the reason given now; the operator's own account answers own-account and nothing changes"
    codes:
      - own-account
      - not-operator
      - account-gone
      - failed
    roles:
      - operator
  accounts.unban:
    description: Lifts the ban of an account, which signs in again.
    params:
      id:
        type: string
        description: The identity id of the account.
    result: the account is not banned and signs in as before; the devices its ban signed out stay signed out; an account not banned stays as it is
    codes:
      - not-operator
      - account-gone
      - failed
    roles:
      - operator
  accounts.revoke-sessions:
    description: Signs every device of an account out.
    params:
      id:
        type: string
        description: The identity id of the account.
    result: every device of the account signs out, and /sign-in shows signed-out-elsewhere on each; the operator's own account answers own-account, since its own devices page does that
    codes:
      - own-account
      - not-operator
      - account-gone
      - failed
    roles:
      - operator
  accounts.send-reset:
    description: Sends an account the mail whose link sets a new password, as the account could ask for itself.
    params:
      id:
        type: string
        description: The identity id of the account.
    result: "the mail below is on its way to the account's email, its link replacing the links of earlier requests, under the account's own allowances: one email takes three within a quarter of an hour, and a fourth answers rate-limited and sends nothing; the mails count toward the operator's network address's budget of mails"
    codes:
      - rate-limited
      - not-operator
      - account-gone
      - failed
    roles:
      - operator
    mail:
      to: account
      language: account
      link: { screen: user.reset-password, search: token }
  accounts.resend-verification:
    description: Sends an account whose email is not verified yet the mail whose link verifies it, again.
    params:
      id:
        type: string
        description: The identity id of the account.
    result: "the mail below is on its way to the account's email, under the account's own allowances: one email takes three within a quarter of an hour, and a fourth answers rate-limited and sends nothing; an account whose email is verified answers verified-before and sends nothing; the mails count toward the operator's network address's budget of mails"
    codes:
      - verified-before
      - rate-limited
      - not-operator
      - account-gone
      - failed
    roles:
      - operator
    mail:
      to: account
      language: account
      link: { screen: user.verify-email, search: token }
  accounts.remove:
    description: Removes an account for good, as its own deletion would, without a mailed link.
    params:
      id:
        type: string
        description: The identity id of the account.
    result: "the account is gone for good, as delete-account leaves it: its profile and its settings, its sessions, so every device of it is signed out, and its memberships; each organisation it was the only member of goes with it, its data too; its email gets the notice below and can sign up again at once; an account that is the only administrator of an organisation with other members answers last-admin and nothing changes, until another member of it is made an administrator or those members are removed; the operator's own account answers own-account"
    codes:
      - last-admin
      - own-account
      - not-operator
      - account-gone
      - failed
    roles:
      - operator
    notices:
      - name: account-deleted
        to: account
        language: account
events:
  started: "The start is done: the browser keeps site data and the app knows who is signed in on this device, so the frame and the open screen can render."
  start-failed: The app's code did not load or run on this device, so it could not start or tell who is signed in.
  opened: The signed-in account's local data is open.
  open-failed: The data of the saved account could not be opened on this device.
  storage-blocked: The browser keeps no site data, so the app stops.
  signed-in: An account signed in on this device, in this tab or another.
  signed-out: The account was signed out on this device, by its own sign-out or from another device.
  password-reset: Another tab of this browser set a new password through the link of a reset mail; the answer names no account.
  theme-set: Another tab of this browser chose the theme of this device.
  change-rejected: The server refused a change, and this device undid it.
  changes-reloaded: The server refused the undo too, so this device loaded the data again and the later changes it had not sent were lost.
  crashed: The open screen failed to render.
  navigated: Another screen opened in the frame, by a link, Back, Forward or an address typed.
  new-version: The server serves a newer version of the app than the one this tab runs.
  protocol-refused: The server no longer takes the sync protocol of the version this tab runs, so this device's changes stop syncing until the page loads again.
  tab-hidden: "The tab went to the background: another tab, another window or a minimised browser."
  synced: The sync of the signed-in account is connected, and no change made on this device waits to be sent.
  sending: The sync of the signed-in account is connected, and changes made on this device are on their way to the server.
  connecting: The browser has a network, but the sync of the signed-in account is not connected yet, or connects again.
  offline: The browser has no network, so changes made on this device wait here until it is back.
  sync-stopped: "The sync of the signed-in account stopped and does not resume in this page: the server no longer takes its protocol, or the browser cannot lead a sync."
  install-offered: The browser can install the app and offers to, and this device has not put the reminder off for now.
  install-by-steps: "The browser installs the app only by the user's own steps (Share, then Add to Home Screen), and this device has not put the reminder off for now."
  installed: The app was installed on this device.
